# ElasticMQ, the SQS-compatible queue for Docker Compose (docker-compose.yaml). The queues match
# terraform/consoletrack/us-east-1/intake.tf's ct-changes-<region>-<suffix> and its DLQ, with
# the suffix `local`, so the worker and scripts/replay-fixtures.py use the same names as on EKS.
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = false
}

# The placeholder account ID used in every fixture (AGENTS.md → Hard rules).
aws {
  region = us-east-1
  accountId = 123456789012
}

queues {
  "ct-changes-use1-local" {
    defaultVisibilityTimeout = 60 seconds
    receiveMessageWait = 20 seconds
    # Same redrive as intake.tf: five failed receives, then the DLQ (intake health shows Down).
    deadLettersQueue {
      name = "ct-changes-dlq-use1-local"
      maxReceiveCount = 5
    }
  }
  "ct-changes-dlq-use1-local" {}
}
