# k8s-mcp ServiceAccount and its read-only Role (product-spec.md → Identity and access).
#
# Plain manifests until the consoletrack chart has templates (#12 picks them up into
# helm/charts/consoletrack/templates/ and loops the Role and RoleBinding over the namespace
# allowlist). One Role + RoleBinding per namespace in K8S_ALLOWED_NAMESPACES; for the course
# that is `demo` only. The kind tests (`make test-k8s`) apply this file as-is.
#
# Deliberately absent: secrets, configmaps, pods/exec, pods/attach, pods/portforward, any write
# verb, and any ClusterRole. `kubectl auth can-i` checks for each are in tests/kind/.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-mcp
  namespace: consoletrack
  labels:
    app.kubernetes.io/name: k8s-mcp
    app.kubernetes.io/part-of: consoletrack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-mcp-read
  namespace: demo
  labels:
    app.kubernetes.io/name: k8s-mcp
    app.kubernetes.io/part-of: consoletrack
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-mcp-read
  namespace: demo
  labels:
    app.kubernetes.io/name: k8s-mcp
    app.kubernetes.io/part-of: consoletrack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-mcp-read
subjects:
  - kind: ServiceAccount
    name: k8s-mcp
    namespace: consoletrack
