[project]
name = "k8s-mcp"
version = "0.1.0"
description = "Read-only Kubernetes MCP server for the ConsoleTrack triage agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastmcp>=4.1,<5",
    "httpx>=0.28",
    "kubernetes>=37",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = [
    "error",
]
markers = [
    "kind: needs a kind cluster with the k8s-mcp RBAC applied; run with `make test-k8s`",
]
