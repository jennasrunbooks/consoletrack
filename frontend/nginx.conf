# Serves the built SPA. /api never reaches this server in a deployment: the gateway (port-forward
# or ALB) routes /api to the backend first (product-spec.md → Architecture).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # If /api does reach this server, answer like the API would rather than with index.html.
    location /api/ {
        include /etc/nginx/security-headers.conf;
        default_type application/json;
        return 404 '{"code":"not_found","message":"The API is served by the backend, not the dashboard."}';
    }

    # Hashed build assets never change.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes (/changes, /incidents/12) all load the app. index.html is revalidated
    # on every load, so a deploy takes effect immediately.
    location / {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
