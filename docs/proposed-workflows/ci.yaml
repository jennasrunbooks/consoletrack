# PROPOSED: a human needs to move this to .github/workflows/ci.yaml, replacing the current file.
# (The agent's token has no Workflows permission; see AGENTS.md → Hard rules, rule 4.)
#
# Changes from the current .github/workflows/ci.yaml (#13, frontend PR 1):
# - `lint` and `test` set up Node 24, because `make lint` now runs lint-frontend (ESLint, tsc,
#   and the openapi.yaml → schema.d.ts check) and `make test` runs test-frontend (Vitest).
# - New `frontend-image` job builds the dashboard image and checks /healthz. It is not meant to
#   be a required check.
# - New `e2e` job runs the Playwright browser tests (`make test-e2e`) in Chromium installed by
#   Playwright, and uploads the HTML report and traces when it fails. `test` sets SKIP_E2E=1 so
#   the browser tests run once, in `e2e`. Add `e2e` to the ruleset's required checks if wanted.
# Job names `lint`, `test`, and `terraform-fmt` are unchanged, so the ruleset needs no change.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v4.3.1"
      - uses: helmfile/helmfile-action@614b4cd063ada10b87f668f6ffd35485bce0cac5 # v2.4.8
        with:
          helm-version: "v4.3.1"
          helmfile-version: "v1.8.2"
          helm-plugins: |
            https://github.com/databus23/helm-diff@v3.15.15
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Vite 8 and MSW 3 need Node >= 22.12; the devcontainer runs 24.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make lint

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Vite 8 and MSW 3 need Node >= 22.12; the devcontainer runs 24.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The browser tests run in the `e2e` job below.
      - run: make test SKIP_E2E=1

  terraform-fmt:
    name: terraform-fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Keep identical to the terraform feature's version in .devcontainer/devcontainer.json,
          # so `terraform fmt` gives the same answer locally and in CI.
          terraform_version: 1.13.4
          terraform_wrapper: false
      # Same as `terraform fmt -check -recursive terraform/`.
      - run: make lint-terraform

  # Playwright against `npm run dev:mock` (MSW in the page, no backend). The tests abort and fail
  # on any request beyond localhost, so the runner's network is only used to install.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      # The version comes from frontend/package-lock.json (@playwright/test, pinned).
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: make test-e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  # Not a required check: builds the dashboard image (amd64, no push) so Dockerfile and
  # nginx.conf changes are exercised. The arm64 build and push belong to the deploy pipeline.
  frontend-image:
    name: frontend-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t consoletrack-frontend:ci frontend/
      - name: Serve /healthz and the app
        run: |
          docker run -d --name fe -p 8080:8080 consoletrack-frontend:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/changes | grep -q '<div id="root">'
          test "$(docker inspect -f '{{.Config.User}}' consoletrack-frontend:ci)" = "101"
