# CI for every PR and push to main. Required checks (main ruleset): lint, test, terraform-fmt.
# Not required: frontend-image and demo-app-image (amd64 builds), e2e (Playwright in Chromium).
# `test` runs with SKIP_E2E=1 so the browser tests run once, in `e2e`.
#
# Changes from the current .github/workflows/ci.yaml (#51, demo-app service):
# - New `demo-app-image` job builds the demo app image (amd64, no push), the same as
#   `frontend-image`: it runs the server and the traffic generator hardened as in the cluster
#   (read-only root, no capabilities), checks both /metrics, and checks the OOM fault's sizing with
#   Docker's memory limit: 128 MiB allocated is killed under 128m and runs under 256m. Not meant to
#   be a required check. Pushing to GHCR belongs to deploy.yaml.
# - `lint` and `test` need no change: `make lint` and `make test` now include lint-demo-app and
#   test-demo-app, which use uv (already set up in both jobs).
# Job names `lint`, `test`, and `terraform-fmt` are unchanged, so the ruleset needs no change.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v4.3.1"
      - uses: helmfile/helmfile-action@614b4cd063ada10b87f668f6ffd35485bce0cac5 # v2.4.8
        with:
          helm-version: "v4.3.1"
          helmfile-version: "v1.8.2"
          helm-plugins: |
            https://github.com/databus23/helm-diff@v3.15.15
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Vite 8 and MSW 3 need Node >= 22.12; the devcontainer runs 24.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make lint

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Vite 8 and MSW 3 need Node >= 22.12; the devcontainer runs 24.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The browser tests run in the `e2e` job below.
      - run: make test SKIP_E2E=1

  terraform-fmt:
    name: terraform-fmt
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Keep identical to the terraform feature's version in .devcontainer/devcontainer.json,
          # so `terraform fmt` gives the same answer locally and in CI.
          terraform_version: 1.13.4
          terraform_wrapper: false
      # Same as `terraform fmt -check -recursive terraform/`.
      - run: make lint-terraform

  # Playwright against `npm run dev:mock` (MSW in the page, no backend). The tests abort and fail
  # on any request beyond localhost, so the runner's network is only used to install.
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      # The version comes from frontend/package-lock.json (@playwright/test, pinned).
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: make test-e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  # Not a required check: builds the dashboard image (amd64, no push) so Dockerfile and
  # nginx.conf changes are exercised. The arm64 build and push belong to the deploy pipeline.
  frontend-image:
    name: frontend-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t consoletrack-frontend:ci frontend/
      - name: Serve /healthz and the app
        run: |
          docker run -d --name fe -p 8080:8080 consoletrack-frontend:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/changes | grep -q '<div id="root">'
          test "$(docker inspect -f '{{.Config.User}}' consoletrack-frontend:ci)" = "101"

  # Not a required check: builds the demo app image (amd64, no push) and runs both modes the way
  # helm/charts/demo-app does. The arm64 build and push belong to the deploy pipeline.
  demo-app-image:
    name: demo-app-image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE: consoletrack-demo-app:ci
      HARDENED: --read-only --cap-drop ALL --security-opt no-new-privileges:true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -t "$IMAGE" demo-app/
      - name: Image size, user, and base
        run: |
          test "$(docker inspect -f '{{.Config.User}}' "$IMAGE")" = "10001"
          docker image inspect -f 'size: {{.Size}} bytes' "$IMAGE"
          grep -m1 '^FROM python' demo-app/Dockerfile
      - name: Server and traffic generator, no AWS (DEMO_BUCKET empty)
        run: |
          docker network create demo
          # shellcheck disable=SC2086 # HARDENED is a list of flags
          docker run -d --name demo-app --network demo $HARDENED "$IMAGE"
          # shellcheck disable=SC2086
          docker run -d --name loadgen --network demo -p 8081:8080 $HARDENED \
            -e DEMO_MODE=loadgen -e LOADGEN_TARGET=http://demo-app:8080/ "$IMAGE"
          for i in $(seq 1 20); do curl -fsS http://localhost:8081/healthz && break; sleep 1; done
          sleep 3
          metrics=$(curl -fsS http://localhost:8081/metrics)
          echo "$metrics" | grep '^demo_client_requests_total'
          echo "$metrics" | grep -Eq '^demo_client_requests_total\{result="ok"\} [1-9]'
          echo "$metrics" | grep -Eq '^demo_client_requests_total\{result="http_error"\} 0'
      - name: OOM fault sizing (128 MiB held)
        run: |
          # The faulted limit: killed at startup.
          # shellcheck disable=SC2086
          docker run --name oom --memory 128m --memory-swap 128m $HARDENED \
            -e DEMO_ALLOCATE_MI=128 "$IMAGE" || true
          test "$(docker inspect -f '{{.State.OOMKilled}}' oom)" = "true"
          # The fix, 2x: keeps running.
          # shellcheck disable=SC2086
          docker run -d --name fixed --memory 256m --memory-swap 256m -p 8082:8080 $HARDENED \
            -e DEMO_ALLOCATE_MI=128 "$IMAGE"
          for i in $(seq 1 20); do curl -fsS http://localhost:8082/healthz && break; sleep 1; done
          curl -fsS http://localhost:8082/metrics | grep '^demo_app_allocated_bytes'
          docker stats --no-stream fixed
      - name: Logs
        if: failure()
        run: for c in demo-app loadgen oom fixed; do docker logs "$c" || true; done

  # Required check (add it to the ruleset): Postgres through Testcontainers, no secrets.
  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
      - run: make test-integration

  # Not a required check: the stack `make local` starts (amd64 here), end to end. SESSION_SECRET
  # and the admin password are generated inside the stack; nothing comes from secrets.
  local-stack:
    name: local-stack
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose up --build --wait --wait-timeout 300
      - name: Log in through the dashboard and read intake health
        run: |
          # localhost, not 127.0.0.1: curl, like browsers, keeps the Secure session cookie
          # over plain HTTP only for localhost.
          base=http://localhost:8080
          curl -fsS "$base/healthz"
          curl -fsS http://127.0.0.1:8000/readyz
          pw=$(docker compose exec -T backend cat /run/consoletrack/admin-password)
          echo "::add-mask::$pw"
          jq -n --arg p "$pw" '{username: "admin", password: $p}' \
            | curl -fsS -c jar -H 'Content-Type: application/json' --data @- "$base/api/v1/auth/login"
          curl -fsS -b jar "$base/api/v1/intake/health" | jq -e '.state == "replay"'
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes
