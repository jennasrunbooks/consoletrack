# Publishes the recorded demo site (frontend `npm run build:demo`) to GitHub Pages.
# Proposed by the agent, which can't push to .github/workflows/: a human moves this file there
# (docs/proposed-workflows/README.md). Repo variables: DEMO_VIDEO_URL (the banner's video link, optional)
# and DEMO_DOMAIN (custom domain, e.g. consoletrack-demo.jennasrunbooks.com; no CNAME file if empty).
# Settings → Pages → Source must be "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/screenshots/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      - run: npm run build:demo
        working-directory: frontend
        env:
          VITE_BASE: /
          VITE_DEMO_VIDEO_URL: ${{ vars.DEMO_VIDEO_URL }}
      - name: Custom domain
        env:
          DEMO_DOMAIN: ${{ vars.DEMO_DOMAIN }}
        run: |
          if [ -n "$DEMO_DOMAIN" ]; then printf '%s\n' "$DEMO_DOMAIN" > frontend/dist-demo/CNAME; fi
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: frontend/dist-demo

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
