[project]
name = "consoletrack"
version = "0.1.0"
description = "ConsoleTrack backend API and triage worker"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.14",
    "anthropic>=1.15,<2",
    "argon2-cffi>=23.1",
    "boto3>=1.40",
    "fastapi>=0.115",
    "fastmcp>=4.1,<5",
    "httpx2>=2.9",
    "itsdangerous>=2.2",
    "kubernetes>=37",
    "opentelemetry-exporter-otlp-proto-http>=1.45,<2",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-sdk>=1.45,<2",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff==0.17.0",
    "testcontainers[postgres]>=4.15",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["app/db/migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Security"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = [
    "error",
]
markers = [
    "integration: needs Docker (Testcontainers Postgres) or CT_TEST_DATABASE_URL; run with -m integration",
]
