{{- if and .Values.canary.enabled (eq .Values.target "eks") }}
# Intake canary: every 15 minutes, tag the empty canary security group with the time. The write
# travels CloudTrail → EventBridge → SQS like a real change; the worker records it as a heartbeat
# and never opens a change for it. Pod Identity role ct-canary-<region>-<suffix>: ec2:CreateTags
# on that one group, tag key ct:canary only.
{{- $sg := .Values.aws.canarySecurityGroupId }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: canary
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "consoletrack.componentLabels" (dict "ctx" $ "name" "canary") | nindent 4 }}
spec:
  schedule: {{ .Values.canary.schedule | quote }}
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 180
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            {{- include "consoletrack.componentLabels" (dict "ctx" $ "name" "canary") | nindent 12 }}
        spec:
          serviceAccountName: canary
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            # The AWS CLI image's default user is root; any UID works with HOME on the emptyDir.
            {{- include "consoletrack.podSecurityContext" (dict "uid" 10001) | nindent 12 }}
          containers:
            - name: canary
              image: {{ printf "%s:%s@%s" .Values.canary.image.repository .Values.canary.image.tag .Values.canary.image.digest }}
              imagePullPolicy: IfNotPresent
              command: [/bin/sh, -ec]
              args:
                - >-
                  exec aws ec2 create-tags
                  --region "$AWS_REGION"
                  --resources "$CANARY_SECURITY_GROUP_ID"
                  --tags "Key=ct:canary,Value=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
              env:
                - name: AWS_REGION
                  value: {{ .Values.aws.region | quote }}
                - name: CANARY_SECURITY_GROUP_ID
                  value: {{ $sg | quote }}
                - name: HOME
                  value: /tmp
                - name: AWS_PAGER
                  value: ""
              resources:
                {{- toYaml .Values.canary.resources | nindent 16 }}
              securityContext:
                {{- include "consoletrack.containerSecurityContext" . | nindent 16 }}
              volumeMounts:
                - {name: tmp, mountPath: /tmp}
          volumes:
            {{- include "consoletrack.tmpVolume" . | nindent 12 }}
{{- end }}
