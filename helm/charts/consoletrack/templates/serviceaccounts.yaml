{{- include "consoletrack.validate" . }}
{{- /*
One ServiceAccount per component. The names are fixed: Pod Identity associations in
terraform/consoletrack/us-east-1 bind consoletrack:worker, consoletrack:aws-mcp, and
consoletrack:canary to their IAM roles. Only the pods that call the Kubernetes API get a token:
the backend (as `remediator`, to apply approved patches) and k8s-mcp (read-only). Pod Identity
mounts its own projected token, so the AWS callers don't need the Kubernetes one.
*/}}
{{- $accounts := list
  (dict "name" "remediator" "token" true)
  (dict "name" "worker" "token" false)
  (dict "name" "frontend" "token" false)
  (dict "name" "k8s-mcp" "token" true)
  (dict "name" "aws-mcp" "token" false)
}}
{{- if and .Values.canary.enabled (eq .Values.target "eks") }}
{{- $accounts = append $accounts (dict "name" "canary" "token" false) }}
{{- end }}
{{- range $accounts }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "consoletrack.componentLabels" (dict "ctx" $ "name" .name) | nindent 4 }}
automountServiceAccountToken: {{ .token }}
{{- end }}
