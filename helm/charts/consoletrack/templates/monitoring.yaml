{{- /*
Observability for the intake (product-spec.md → Intake health and canary): Prometheus scrapes
the backend's /metrics, ConsoleTrackCanaryMissing fires when no canary has arrived for 45
minutes, and Alertmanager sends the alerts that should open an incident to the backend's webhook
with the bearer token from the consoletrack-webhook Secret.

Only user-impact alerts open incidents: rules that carry `consoletrack_incident: "true"`
(ConsoleTrackCanaryMissing here, DemoAppHighErrorRate in the demo-app chart). Symptoms such as
KubePodCrashLooping stay in Alertmanager and Grafana as evidence the agent can query; routing them
too opened a second incident for the same OOM episode (#79). The add-on values (helm/values/kube-prometheus-stack.yaml)
make Prometheus and Alertmanager pick these up from any namespace.
*/}}
{{- if .Values.monitoring.serviceMonitor }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "consoletrack.componentLabels" (dict "ctx" $ "name" "backend") | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "consoletrack.selectorLabels" (dict "ctx" $ "name" "backend") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
{{- if and .Values.monitoring.alertRules .Values.canary.enabled (eq .Values.target "eks") }}
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: consoletrack-intake
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "consoletrack.labels" . | nindent 4 }}
spec:
  groups:
    - name: consoletrack-intake
      rules:
        # The canary arrived before but not in the last 45 minutes.
        - alert: ConsoleTrackCanaryMissing
          expr: |
            max(consoletrack_canary_last_seen_timestamp_seconds) > 0
            and
            time() - max(consoletrack_canary_last_seen_timestamp_seconds) > 45 * 60
          for: 1m
          labels:
            severity: warning
            namespace: {{ .Release.Namespace }}
            workload: canary
            consoletrack_incident: "true"
          annotations:
            summary: No intake canary for 45 minutes
            description: >-
              The canary tags its security group every 15 minutes, and the tag change should
              arrive through CloudTrail, EventBridge, and SQS within minutes. Check the canary
              CronJob, the trail, the EventBridge rule, the queue, and the worker.
        # The canary has never arrived (0 = never) for 45 minutes after the backend started.
        - alert: ConsoleTrackCanaryMissing
          expr: max(consoletrack_canary_last_seen_timestamp_seconds) == 0
          for: 45m
          labels:
            severity: warning
            namespace: {{ .Release.Namespace }}
            workload: canary
            consoletrack_incident: "true"
          annotations:
            summary: The intake canary has never arrived
            description: >-
              No canary has come through the intake since ConsoleTrack started. Check the canary
              CronJob, the trail, the EventBridge rule, the queue, and the worker.
{{- end }}
{{- if .Values.monitoring.alertmanagerConfig }}
---
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: consoletrack
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "consoletrack.labels" . | nindent 4 }}
spec:
  route:
    receiver: consoletrack-backend
    # One notification per affected workload; the backend opens one incident per alert.
    groupBy: [namespace, workload]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    matchers:
      # Only user-impact alerts open incidents (the comment at the top).
      - name: consoletrack_incident
        matchType: "="
        value: "true"
      # And only for workloads ConsoleTrack can investigate (k8s-mcp's allowlist) or its own.
      - name: namespace
        matchType: "=~"
        value: {{ prepend .Values.allowedNamespaces .Release.Namespace | join "|" | quote }}
  receivers:
    - name: consoletrack-backend
      webhookConfigs:
        - url: {{ .Values.monitoring.webhookUrl | default (printf "http://backend.%s.svc.cluster.local:%d/api/v1/alerts/webhook" .Release.Namespace (int .Values.backend.port)) | quote }}
          sendResolved: true
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: {{ .Values.secrets.webhook.name }}
                key: {{ .Values.secrets.webhook.alertWebhookToken }}
{{- end }}
{{- if .Values.monitoring.dashboard }}
---
# Picked up by kube-prometheus-stack's Grafana sidecar, which watches every namespace.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-intake-health
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "consoletrack.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  intake-health.json: |-
    {{- .Files.Get "files/intake-health.json" | nindent 4 }}
{{- end }}
