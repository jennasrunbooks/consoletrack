# The demo app's Kubernetes side (namespace demo). Its AWS side - IAM role, S3 bucket, security
# group, and the demo:demo-app Pod Identity association - is terraform/demo-app/us-east-1.

image:
  repository: ghcr.io/jennasrunbooks/consoletrack-demo-app
  # Empty = the chart's appVersion. deploy.yaml sets the commit SHA.
  tag: ""
  pullPolicy: IfNotPresent

replicas: 1
port: 8080

# The object it reads on every request (terraform/demo-app/us-east-1 outputs). Empty bucket =
# no AWS (kind): the app serves without the S3 read.
aws:
  region: us-east-1
  bucket: ""
  objectKey: seed.txt

# The app uses ~50 MiB (~25 MiB on kind, where boto3 is never loaded), plus the report cache
# under the OOM fault. 128Mi fits the app alone, not a full cache: see faults.oom.
resources:
  requests: {cpu: 10m, memory: 64Mi}
  limits: {cpu: 200m, memory: 128Mi}

# Every `X-Demo-Report: large` request adds perRequestMi to an in-memory cache bounded at capMi
# (DEMO_REPORT_MI, DEMO_REPORT_CACHE_MI). Always set, whatever the faults: only the traffic
# generator's requests decide whether the cache fills.
reportCache:
  perRequestMi: 2
  capMi: 140

probes:
  path: /healthz

# Cluster faults for the baseline scenarios (`make demo`, the break-demo skill). At most one at a
# time. Set them through Helmfile's demoFault state value (README → Faults), which also turns off
# wait and atomic for that sync.
faults:
  # The app outgrows its limit; nothing about the app rolls out. Only the traffic generator
  # changes: it sends `X-Demo-Report: large` on every request, so at loadgen.rps the cache passes
  # the 128Mi limit within about 15s of each start: OOMKilled under traffic, CrashLoopBackOff,
  # with no new demo-app revision. The fix the agent should find is set_memory_limit to 256Mi:
  # exactly oom-memory-bump's 2x, under its 512Mi ceiling, and a full cache plus the app
  # (~140 + 50 MiB on EKS) leaves ~65 MiB of headroom with the fault still on.
  oom: false
  # An image tag that doesn't exist: ImagePullBackOff, fixed by a rollout undo.
  badImage: false
  badImageTag: does-not-exist
  # Liveness and readiness on a path the app doesn't serve: restarts, never Ready.
  badProbe: false
  badProbePath: /not-a-health-check

serviceMonitor:
  enabled: true

# DemoAppHighErrorRate (templates/prometheusrule.yaml): more than 5% of the traffic generator's
# requests failing for a minute. Built on loadgen's metrics, so it needs loadgen.enabled.
alertRules:
  enabled: true

# The traffic generator: the same image with DEMO_MODE=loadgen, calling the demo-app Service at a
# steady rate and exporting demo_client_requests_total{result="ok|http_error|conn_error|timeout"}.
# DemoAppHighErrorRate is measured here, on the client's side, because an OOMKilled or never-Ready
# app serves nothing and exports no metrics of its own. The faults never touch it.
loadgen:
  enabled: true
  rps: 5
  timeoutSeconds: 1
  resources:
    requests: {cpu: 10m, memory: 48Mi}
    limits: {cpu: 100m, memory: 96Mi}
  # Shorter than the app's 30s so the alert's 2m rate has enough samples within a minute.
  scrapeInterval: 15s
