# The demo app's Kubernetes side (namespace demo). Its AWS side - IAM role, S3 bucket, security
# group, and the demo:demo-app Pod Identity association - is terraform/demo-app/us-east-1.

image:
  repository: ghcr.io/jennasrunbooks/consoletrack-demo-app
  # Empty = the chart's appVersion. deploy.yaml sets the commit SHA.
  tag: ""
  pullPolicy: IfNotPresent

replicas: 1
port: 8080

# The object it reads on every request (terraform/demo-app/us-east-1 outputs). Empty bucket =
# no AWS (kind): the app serves without the S3 read.
aws:
  region: us-east-1
  bucket: ""
  objectKey: seed.txt

# The app uses ~50 MiB (~25 MiB on kind, where boto3 is never loaded). The limit is sized so the
# OOM fault's correct fix, 2x the faulted limit, still fits: see faults.oom.
resources:
  requests: {cpu: 10m, memory: 128Mi}
  limits: {cpu: 200m, memory: 256Mi}

probes:
  path: /healthz

# Cluster faults for the baseline scenarios (`make demo`, the break-demo skill). At most one at a
# time; turning it off again is the fix the agent should find. Set them through Helmfile's
# demoFault state value (README → Faults), which also turns off wait and atomic for that sync.
faults:
  # Memory request and limit drop to oomMemoryLimit and the app allocates and holds allocateMi at
  # startup, before it listens: ~150 MiB on kind, ~175 MiB with the S3 client on EKS, so the
  # container is OOMKilled every start (CrashLoopBackOff). The correct fix, 256Mi, is exactly
  # oom-memory-bump's 2x (and under its 512Mi ceiling) and leaves ~80 MiB of headroom with
  # DEMO_ALLOCATE_MI still set.
  oom: false
  oomMemoryLimit: 128Mi
  allocateMi: 128
  # Seconds the app waits after starting before it allocates (DEMO_ALLOCATE_DELAY_SECONDS). A kill
  # within about a second of start can be reported as Error (exit 137) instead of OOMKilled; a
  # few seconds in, it's OOMKilled every restart. Well under the liveness probe's 30s.
  allocateDelaySeconds: 3
  # An image tag that doesn't exist: ImagePullBackOff, fixed by a rollout undo.
  badImage: false
  badImageTag: does-not-exist
  # Liveness and readiness on a path the app doesn't serve: restarts, never Ready.
  badProbe: false
  badProbePath: /not-a-health-check

serviceMonitor:
  enabled: true

# DemoAppHighErrorRate (templates/prometheusrule.yaml): more than 5% of the traffic generator's
# requests failing for a minute. Built on loadgen's metrics, so it needs loadgen.enabled.
alertRules:
  enabled: true

# The traffic generator: the same image with DEMO_MODE=loadgen, calling the demo-app Service at a
# steady rate and exporting demo_client_requests_total{result="ok|http_error|conn_error|timeout"}.
# DemoAppHighErrorRate is measured here, on the client's side, because an OOMKilled or never-Ready
# app serves nothing and exports no metrics of its own. The faults never touch it.
loadgen:
  enabled: true
  rps: 5
  timeoutSeconds: 1
  resources:
    requests: {cpu: 10m, memory: 48Mi}
    limits: {cpu: 100m, memory: 96Mi}
  # Shorter than the app's 30s so the alert's 2m rate has enough samples within a minute.
  scrapeInterval: 15s
