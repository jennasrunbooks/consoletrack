# Tempo (tier=addons, namespace monitoring, eks only): single binary, traces on an emptyDir for
# 24 hours. The local stack's observability/tempo/tempo.yaml is the same shape, on tmpfs.
# Image pinned by tag and digest, the same one `make local` runs (docker-compose.yaml).
tempo:
  registry: docker.io
  repository: grafana/tempo
  tag: 3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
  reportingEnabled: false
  streamOverHttpEnabled: true
  # Blocks older than this are deleted (backend scheduler compaction).
  retention: 24h
  extraVolumeMounts:
    - {name: data, mountPath: /var/tempo}
  resources:
    requests: {cpu: 25m, memory: 128Mi}
    limits: {memory: 384Mi}
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]

# The root filesystem is read-only, so /var/tempo (WAL and blocks) is an emptyDir. Traces last
# until the pod restarts; `make down` leaves no PVC behind.
extraVolumes:
  - name: data
    emptyDir: {sizeLimit: 2Gi}
securityContext:
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
serviceAccount:
  create: true
  automountServiceAccountToken: false
