# Environment values for the local target: kind, no AWS. No Load Balancer Controller or
# ExternalDNS, no canary; the intake replays recorded CloudTrail events and aws-mcp answers from
# fixtures (make demo-replay). values.generated.yaml is layered on top here too.
target: local

exposure: port-forward
domain: ""
allowedCidrs: []
nameSuffix: local
awsRegion: us-east-1
watchedIamPaths: /demo-app/
triageModel: claude-haiku-5-5
triageModelEscalation: claude-sonnet-5-5
grafanaUrl: ""

clusterName: ""
vpcId: ""
certificateArn: ""
changesQueueUrl: ""
changesDlqUrl: ""
trailName: ""
canarySecurityGroupId: ""
demoBucket: ""

# Images loaded into kind by the local-run workflow (`kind load docker-image ...:local`).
imageTag: local

# A demo-app fault (empty, oom, badImage, badProbe), set per run: --state-values-set demoFault=oom.
demoFault: ""
# demo-app's memory limit for one sync (make local-measure sets 512Mi); empty: the chart's.
demoMemoryLimit: ""
# demo-app's report cache (MiB) for one sync (make measure CACHE_MI=96); empty: the chart's.
demoReportCacheMi: ""

# aws-mcp's fixtures mode isn't implemented yet (it refuses to start with AWS_MCP_MODE=fixtures),
# so kind runs without it and the worker without AWS tools.
awsMcpEnabled: false

# Off on kind: `make local` runs Tempo, Loki, and the collector in Compose (docs/observability.md).
observability: false

intakeMode: replay
# kind's built-in local-path class.
storageClass: standard
