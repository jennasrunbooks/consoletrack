# Loki 3, single binary, for `make local`: filesystem storage on the container's tmpfs (logs last
# until the container restarts). The collector writes through Loki's native OTLP endpoint.
# Based on grafana/loki cmd/loki/loki-local-config.yaml at v3.7.9.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /tmp/loki
  storage:
    filesystem:
      chunks_directory: /tmp/loki/chunks
      rules_directory: /tmp/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 32

limits_config:
  # trace_id and span_id arrive as structured metadata (the v13 schema keeps it).
  allow_structured_metadata: true

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

analytics:
  reporting_enabled: false
