openapi: 3.1.0
info:
  title: ConsoleTrack API
  version: 0.1.0
  summary: Out-of-band AWS changes as reviewable records, linked to the EKS incidents they cause.
  description: |
    The contract between the ConsoleTrack backend and its dashboard, Alertmanager, and GitHub.
    This file is the source of truth: the frontend client is generated from it, and
    `backend/tests/contract/` fails if FastAPI's generated schema drifts from it.

    **Auth.** Two fixed accounts, `admin` and a read-only `viewer`, each get a session cookie
    from `POST /api/v1/auth/login`. The cookie is `HttpOnly; Secure; SameSite=Strict`, which is
    what keeps another site from triggering an admin write (CSRF). Every read accepts either
    role; every write requires `admin` (listed as the `admin` role on the `sessionCookie`
    requirement, and stated in the operation's description). Alertmanager authenticates with a
    bearer token; GitHub signs its webhook with HMAC-SHA256 (see `githubSignature`).

    **Revert status.** The backend polls the dispatched workflow run's status through the GitHub
    API, which works with any `EXPOSURE`. The `workflow_run` webhook is an optional extra for
    `EXPOSURE=alb`, where GitHub can reach the backend. Either path moves the change through the
    same state machine, and whichever reports first wins.

    **Phases.** Operations without `x-phase` are Phase 1. `x-phase: 2` marks operations whose
    contract is fixed now but that ship in Phase 2; until then they return `501`.

    **Errors.** Every error body is an `Error`, including request validation failures (`422`),
    which the backend maps from FastAPI's default shape.

    **Untrusted text.** Fields that come from CloudTrail, pod logs, or alerts
    (`request_parameters`, `user_agent`, `result_excerpt`, alert labels and annotations) are
    attacker-influenced data. Render them as text, never as HTML or Markdown.
  license:
    name: Apache-2.0
    identifier: Apache-2.0
servers:
  - url: http://localhost:8000
    description: Local backend (Compose, `make local`, `make demo-replay`, or a port-forward)
security:
  - sessionCookie: []
tags:
  - name: auth
    description: Session login for the admin and viewer accounts
  - name: changes
    description: Out-of-band AWS changes (the change log) and the review decisions on them
  - name: incidents
    description: Alert-driven incidents, their triage, and cluster remediation
  - name: evidence
    description: Tool calls the triage agent made, per change or incident
  - name: webhooks
    description: Inbound webhooks from Alertmanager and GitHub
  - name: intake
    description: Health of the CloudTrail → EventBridge → SQS change intake
  - name: stats
    description: Analytics (Phase 2)
  - name: ops
    description: Probes and metrics for Kubernetes and Prometheus

paths:
  # ---------------------------------------------------------------------------------------------
  # Auth
  # ---------------------------------------------------------------------------------------------
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in and receive a session cookie
      description: |
        An unknown username and a wrong password get the same `401`. After 5 failed attempts
        for one username, or from one client address, within 5 minutes, further attempts get
        `429` until the oldest failure is 5 minutes old. The session lasts 8 hours.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in. The session cookie is set.
          headers:
            Set-Cookie:
              description: |
                `ct_session=<opaque>; HttpOnly; Secure; SameSite=Strict; Path=/`. SameSite=Strict
                is the CSRF defense for every admin write: another site can't make the browser
                send this cookie. Browsers treat http://localhost as secure, so Secure also works
                locally and through `make open`. A public deployment is HTTPS only:
                `EXPOSURE=alb` requires `DOMAIN` and its certificate, because a browser drops a
                Secure cookie over plain HTTP.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the current session
      responses:
        "204":
          description: Logged out. The session cookie is cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: The logged-in account and its role
      description: The dashboard uses the role to disable write buttons for the viewer.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ---------------------------------------------------------------------------------------------
  # Changes
  # ---------------------------------------------------------------------------------------------
  /api/v1/changes:
    get:
      tags: [changes]
      operationId: listChanges
      summary: List changes (the change log)
      description: |
        Newest first by `event_time`. Filters combine with AND; repeated values of one filter
        (`status=a&status=b`) combine with OR. `counts` in the response applies every filter
        except `status`, so the status chips keep their numbers while one status is selected.
      parameters:
        - name: status
          in: query
          description: Only these statuses. The "Closed" chip sends `reverted`, `accepted`, and `codified`.
          schema:
            type: array
            items:
              $ref: "#/components/schemas/ChangeStatus"
          style: form
          explode: true
        - name: risk
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Risk"
          style: form
          explode: true
        - name: via
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/Via"
          style: form
          explode: true
        - name: principal
          in: query
          description: Case-insensitive substring of `principal_arn` or `session_name`.
          schema:
            type: string
            maxLength: 256
        - name: service
          in: query
          description: CloudTrail service short name, e.g. `iam`, `ec2`, `s3`, `kms`, `eks`.
          schema:
            type: string
            maxLength: 64
            pattern: "^[a-z0-9-]+$"
        - name: since
          in: query
          description: Only changes with `event_time` at or after this time.
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          description: Only changes with `event_time` before this time.
          schema:
            type: string
            format: date-time
        - name: q
          in: query
          description: Free-text search over title, resource name and ARN, principal, and event name.
          schema:
            type: string
            maxLength: 256
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangePage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/changes/{id}:
    get:
      tags: [changes]
      operationId: getChange
      summary: One change with its analysis, drift, linked incidents, and remediation
      parameters:
        - $ref: "#/components/parameters/ChangeId"
      responses:
        "200":
          description: The change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/changes/{id}/revert:
    post:
      tags: [changes]
      operationId: revertChange
      summary: Revert to Terraform through the gated workflow
      description: |
        Requires admin. Dispatches `revert.yaml` for this change; the run then waits in the
        `consoletrack-revert` GitHub environment for a reviewer before anything is applied. The
        change moves `awaiting_review` → `reverting`, and to `reverted` or `failed` when the run
        finishes. The backend learns that by polling the run's status (the default, and the only
        path with `EXPOSURE=port-forward`), or sooner from the optional `workflow_run` webhook.
        `run_url` is null if GitHub hasn't returned the run yet; it then appears on the change's
        remediation. In replay mode
        (`IntakeState` = `replay`) this returns `409` ("AWS required").
      security:
        - sessionCookie: [admin]
      parameters:
        - $ref: "#/components/parameters/ChangeId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevertRequest"
      responses:
        "202":
          description: Workflow dispatched.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevertResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/changes/{id}/accept:
    post:
      tags: [changes]
      operationId: acceptChange
      summary: Accept the change with a required note
      description: |
        Requires admin. Closes the change as `accepted`, recording the note as the reason and
        the admin as `decided_by`. Allowed from `detected` and `awaiting_review`.
      security:
        - sessionCookie: [admin]
      parameters:
        - $ref: "#/components/parameters/ChangeId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptRequest"
      responses:
        "200":
          description: The accepted change.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/changes/{id}/codify:
    post:
      tags: [changes]
      operationId: codifyChange
      summary: Open a pull request that adopts the change in Terraform (Phase 2)
      description: |
        Requires admin. The agent drafts HCL that matches the live resource and opens a pull
        request; CI must show a `terraform plan` with no changes before it can merge. The change
        moves to `codifying`, then `codified` when the pull request merges. Returns `501` until
        Phase 2 ships.
      x-phase: 2
      security:
        - sessionCookie: [admin]
      parameters:
        - $ref: "#/components/parameters/ChangeId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CodifyRequest"
      responses:
        "202":
          description: Codify started; the change is now `codifying`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Change"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "501":
          $ref: "#/components/responses/NotImplemented"

  # ---------------------------------------------------------------------------------------------
  # Incidents
  # ---------------------------------------------------------------------------------------------
  /api/v1/incidents:
    get:
      tags: [incidents]
      operationId: listIncidents
      summary: List incidents
      description: Newest first by `opened_at`. Filters combine with AND.
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items:
              $ref: "#/components/schemas/IncidentStatus"
          style: form
          explode: true
        - name: severity
          in: query
          description: The alert's `severity` label, e.g. `critical`, `warning`.
          schema:
            type: string
            maxLength: 64
        - name: namespace
          in: query
          schema:
            type: string
            maxLength: 63
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: One page of incidents.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/incidents/{id}:
    get:
      tags: [incidents]
      operationId: getIncident
      summary: One incident with its analysis, linked changes, and remediation
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      responses:
        "200":
          description: The incident.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/incidents/{id}/triage:
    post:
      tags: [incidents]
      operationId: triageIncident
      summary: Re-run triage, optionally with another model
      description: |
        Requires admin. Starts a new agent run and moves the incident to `triaging`. Allowed
        from `open` and `awaiting_review`. `model` must be the configured default or escalation
        model (`TRIAGE_MODEL`, `TRIAGE_MODEL_ESCALATION`); anything else is `422`.
      security:
        - sessionCookie: [admin]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TriageRequest"
      responses:
        "202":
          description: Triage started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/incidents/{id}/remediation/approve:
    post:
      tags: [incidents]
      operationId: approveIncidentRemediation
      summary: Approve the proposed remediation
      description: |
        Requires admin. The incident moves `awaiting_review` → `remediating` and the remediation
        `proposed` → `approved`; the backend's apply loop then takes it through the same path as
        an auto fix: the deterministic validator against the live Deployment, a server-side dry
        run, the patch through the `remediator` ServiceAccount, the rollout, and verify (see
        `Remediation.steps`). If the validator refuses it or verify fails (the patch is rolled
        back), the remediation ends `failed` with the reason and the incident returns to
        `awaiting_review`. The incident becomes `resolved` on Alertmanager's resolved
        notification. Only `set_memory_limit` can be applied today; other kinds answer `501`
        (`revert_workflow` will dispatch the linked change's revert, as
        `POST /api/v1/changes/{id}/revert`). `409` when the latest remediation isn't `proposed`
        or the incident isn't `awaiting_review`.
      security:
        - sessionCookie: [admin]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRemediationRequest"
      responses:
        "200":
          description: Remediation approved and started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/incidents/{id}/remediation/reject:
    post:
      tags: [incidents]
      operationId: rejectIncidentRemediation
      summary: Reject the proposed remediation and close the incident
      description: |
        Requires admin. Marks the remediation `rejected` and closes the incident (`closed`) with
        the reason. `409` when the latest remediation isn't `proposed`.
      security:
        - sessionCookie: [admin]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RejectRemediationRequest"
      responses:
        "200":
          description: Remediation rejected; incident closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Incident"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/incidents/{id}/postmortem:
    put:
      tags: [incidents]
      operationId: savePostmortem
      summary: Save the edited postmortem
      description: Requires admin. Replaces the postmortem Markdown on the incident's analysis.
      security:
        - sessionCookie: [admin]
      parameters:
        - $ref: "#/components/parameters/IncidentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PostmortemRequest"
      responses:
        "200":
          description: The updated analysis.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Analysis"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ---------------------------------------------------------------------------------------------
  # Evidence
  # ---------------------------------------------------------------------------------------------
  /api/v1/{subject}/{id}/evidence:
    get:
      tags: [evidence]
      operationId: listEvidence
      summary: Tool calls the agent made for a change or an incident
      description: |
        Every agent run's tool calls, oldest first, already redacted. Not paginated: a run is
        capped at 12 tool calls.
      parameters:
        - name: subject
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/SubjectPath"
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: The evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ---------------------------------------------------------------------------------------------
  # Webhooks
  # ---------------------------------------------------------------------------------------------
  /api/v1/alerts/webhook:
    post:
      tags: [webhooks]
      operationId: receiveAlertmanagerWebhook
      summary: Ingest firing and resolved alerts from Alertmanager
      description: |
        Alertmanager webhook payload, version 4. A firing alert opens an incident in `open`
        (deduplicated on `fingerprint` while one is unresolved); a resolved alert moves the
        matching incident to `resolved`.
      security:
        - webhookBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertmanagerWebhook"
      responses:
        "202":
          description: Accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertWebhookResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  /api/v1/integrations/github/workflow-run:
    post:
      tags: [webhooks]
      operationId: receiveGithubWorkflowRun
      summary: Update a revert's status when its workflow run finishes
      description: |
        Optional. The backend already polls each revert run's status, so Revert works without
        this webhook; it only shortens the wait when GitHub can reach the backend
        (`EXPOSURE=alb`). Signed with `X-Hub-Signature-256` using `GITHUB_WEBHOOK_SECRET`; the
        backend returns `401` on a missing or bad signature. Only `revert.yaml`
        runs are acted on, matched to a change by the run's `display_title`
        (`revert change <id>`); other events are acknowledged and ignored. A `completed` run
        moves the change to `reverted` (conclusion `success`) or `failed` (anything else).
      security:
        - githubSignature: []
      parameters:
        - name: X-GitHub-Event
          in: header
          required: true
          schema:
            type: string
        - name: X-GitHub-Delivery
          in: header
          required: true
          description: Delivery ID, used to ignore redeliveries.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GithubWorkflowRunEvent"
      responses:
        "204":
          description: Processed or ignored.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"

  # ---------------------------------------------------------------------------------------------
  # Intake, stats, ops
  # ---------------------------------------------------------------------------------------------
  /api/v1/intake/health:
    get:
      tags: [intake]
      operationId: getIntakeHealth
      summary: Whether AWS change events are reaching ConsoleTrack
      description: |
        Backs the header indicator and its panel. See `product-spec.md` → Intake health and
        canary for how `state` is derived.
      responses:
        "200":
          description: Intake health.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntakeHealth"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/stats:
    get:
      tags: [stats]
      operationId: getStats
      summary: Change analytics (Phase 2)
      description: Returns `501` until Phase 2 ships.
      x-phase: 2
      parameters:
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Stats for the window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "501":
          $ref: "#/components/responses/NotImplemented"

  /metrics:
    get:
      tags: [ops]
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        Intake and agent metrics, including `consoletrack_intake_last_event_timestamp_seconds`,
        `consoletrack_canary_last_seen_timestamp_seconds`,
        `consoletrack_sqs_oldest_message_age_seconds`, `consoletrack_dlq_messages`, and
        `consoletrack_intake_state`. Served inside the cluster only; the Gateway routes `/api`,
        not `/metrics`.
      security: []
      responses:
        "200":
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string

  /healthz:
    get:
      tags: [ops]
      operationId: healthz
      summary: Liveness probe
      security: []
      responses:
        "200":
          description: The process is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeStatus"

  /readyz:
    get:
      tags: [ops]
      operationId: readyz
      summary: Readiness probe (checks the database)
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeStatus"
        "503":
          description: Not ready; `checks` says which dependency failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProbeStatus"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ct_session
      description: |
        Session cookie from `POST /api/v1/auth/login`, set `HttpOnly; Secure; SameSite=Strict`.
        Roles: `admin` (everything) and `viewer` (reads only). A requirement listing `admin`
        means the viewer gets `403`.
    webhookBearer:
      type: http
      scheme: bearer
      description: "Shared token Alertmanager sends as `Authorization: Bearer <token>`."
    githubSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: |
        `sha256=<hex>`: HMAC-SHA256 of the raw request body, keyed with `GITHUB_WEBHOOK_SECRET`
        from `.env`, as GitHub sends it. The backend recomputes it over the raw bytes and compares
        with a constant-time comparison (`hmac.compare_digest`). GitHub webhooks can't send an
        `Authorization` header, so a bearer token doesn't work here.

  parameters:
    ChangeId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    IncidentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    Page:
      name: page
      in: query
      description: 1-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25

  responses:
    BadRequest:
      description: Malformed request (bad JSON, wrong content type).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: No valid session, token, or signature.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Logged in, but the action requires the admin role.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such change or incident.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        Not allowed in the subject's current state (for example, reverting a change that is
        already `accepted`, or approving when there is no proposed remediation).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntity:
      description: The request failed validation; `details` lists each problem.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Too many failed logins for this username or address; see `Retry-After`.
      headers:
        Retry-After:
          description: Seconds until another attempt is allowed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotImplemented:
      description: The operation is part of a later phase.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    # --- Enums --------------------------------------------------------------------------------
    ChangeStatus:
      type: string
      description: |
        `detected` → `awaiting_review` (agent summary written) → one of `reverting` → `reverted`,
        `accepted`, or `codifying` → `codified`. `failed` means a revert or codify run failed;
        the change can be reviewed again from there.
      enum: [detected, awaiting_review, reverting, reverted, accepted, codifying, codified, failed]
    Via:
      type: string
      description: |
        Where an out-of-band change came from, from the CloudTrail user agent. `cloudshell` is
        an AWS CLI call that carries CloudShell's user-agent marker; the plain `aws-cli/...`
        agent is `cli`. `terraform_outside_pipeline` is a Terraform user agent from a caller that
        isn't a pipeline role.
      enum: [console, cli, cloudshell, sdk, terraform_outside_pipeline]
    Risk:
      type: string
      enum: [low, medium, high]
    Confidence:
      type: string
      enum: [low, medium, high]
    AnalysisFlag:
      type: string
      description: |
        Caveats the agent attaches to an analysis. `possible_prompt_injection`: tool output
        contained instructions aimed at the agent. `aws_evidence_unavailable`: the AWS lookups
        failed or weren't available. `cloudtrail_delay`: logs show an AWS error but CloudTrail had
        no matching change yet. `insufficient_evidence`: not enough to conclude.
        `stateful_workload` and `migration` mark a fix that needs extra care.
      enum:
        - stateful_workload
        - migration
        - cloudtrail_delay
        - aws_evidence_unavailable
        - possible_prompt_injection
        - insufficient_evidence
    ChangeDecision:
      type: string
      description: The reviewer's choice, set when the change leaves `awaiting_review`.
      enum: [revert, accept, codify]
    IncidentStatus:
      type: string
      description: |
        `open` → `triaging` → `awaiting_review` → `remediating` → `resolved`. `closed` is a
        rejection or a manual close without remediation. A `resolved` webhook moves any
        unresolved state to `resolved`.
      enum: [open, triaging, awaiting_review, remediating, resolved, closed]
    IntakeState:
      type: string
      enum: [live, delayed, down, replay]
    RemediationKind:
      type: string
      description: |
        `set_memory_limit` is the agent's proposal after an OOM kill (raise one container's memory
        limit); the other kinds are `cluster_patch`, `rollback`, `revert_workflow`, `codify_pr`.
      enum: [cluster_patch, set_memory_limit, rollback, revert_workflow, codify_pr]
    RemediationStatus:
      type: string
      description: |
        `proposed` → `approved` → `running` → `succeeded` or `failed`; or `proposed` →
        `rejected`. An auto fix the validator refuses before anything is applied goes `running`
        → `proposed` with `mode: manual` and the reason in `gate_reason`: it waits for a human.
      enum: [proposed, approved, rejected, running, succeeded, failed]
    RemediationMode:
      type: string
      description: |
        The policy gate's decision: `manual` (an admin approves or rejects) or `auto` (the gate
        approved on the admin's behalf; `decided_by` is `policy:<name>`).
      enum: [manual, auto]
    SubjectType:
      type: string
      enum: [change, incident]
    SubjectPath:
      type: string
      description: Collection name of the subject in a URL.
      enum: [changes, incidents]
    Role:
      type: string
      enum: [admin, viewer]
    AgentRunOutcome:
      type: string
      description: |
        `limit_reached`: the run used its tool-call limit without submitting an analysis;
        `timed_out` and `budget_exceeded` are the time and token limits. All three leave the
        subject for a human.
      enum: [running, succeeded, failed, timed_out, budget_exceeded, limit_reached]

    # --- Auth -----------------------------------------------------------------------------------
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 256
          writeOnly: true
    User:
      type: object
      required: [username, role]
      properties:
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"

    # --- Changes --------------------------------------------------------------------------------
    IncidentRef:
      type: object
      description: Short reference to an incident, for links ("INC-12 · demo-app CrashLoopBackOff").
      required: [id, alertname, namespace, workload, status]
      properties:
        id:
          type: integer
          format: int64
        alertname:
          type: string
        namespace:
          type:
            - string
            - "null"
        workload:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/IncidentStatus"
    ChangeRef:
      type: object
      description: Short reference to a change, for links from an incident.
      required: [id, title, event_name, risk, status]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        event_name:
          type: string
        risk:
          anyOf:
            - $ref: "#/components/schemas/Risk"
            - type: "null"
        status:
          $ref: "#/components/schemas/ChangeStatus"
    ChangeSummary:
      type: object
      description: One row of the change log. The UI shows `id` as `CHG-0042`.
      required:
        - id
        - title
        - event_name
        - service
        - event_time
        - detected_at
        - resource_arn
        - resource_name
        - tf_address
        - principal_arn
        - session_name
        - via
        - risk
        - status
        - linked_incidents
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
          description: |
            One-line summary ("SSH opened to the internet on the demo security group"). Written
            by the agent; until then, built from the event and resource names.
        event_name:
          type: string
          examples: [AuthorizeSecurityGroupIngress]
        service:
          type: string
          description: CloudTrail service short name.
          examples: [ec2]
        event_time:
          type: string
          format: date-time
          description: When the change was made (CloudTrail `eventTime`).
        detected_at:
          type: string
          format: date-time
          description: When ConsoleTrack recorded it.
        resource_arn:
          type: string
        resource_name:
          type:
            - string
            - "null"
          description: Human name of the resource, e.g. `demo-app-sg`.
        tf_address:
          type:
            - string
            - "null"
          description: Terraform address in the demo-app root's state; null if unmanaged or not looked up yet.
          examples: [aws_security_group.demo_app]
        principal_arn:
          type: string
        session_name:
          type:
            - string
            - "null"
          description: Assumed-role session name, usually the person (`jdev`).
        via:
          $ref: "#/components/schemas/Via"
        risk:
          anyOf:
            - $ref: "#/components/schemas/Risk"
            - type: "null"
          description: Null until the agent has assessed the change.
        status:
          $ref: "#/components/schemas/ChangeStatus"
        linked_incidents:
          type: array
          items:
            $ref: "#/components/schemas/IncidentRef"
    LinkedIncident:
      type: object
      required: [incident, confidence]
      properties:
        incident:
          $ref: "#/components/schemas/IncidentRef"
        confidence:
          $ref: "#/components/schemas/Confidence"
    DriftLine:
      type: object
      required: [op, text]
      properties:
        op:
          type: string
          description: "`context`: in Terraform and live; `added`: live only; `removed`: Terraform only."
          enum: [context, added, removed]
        text:
          type: string
        note:
          type:
            - string
            - "null"
          description: Short explanation shown after the line, e.g. "live only, added out of band".
    Drift:
      type: object
      description: |
        "Terraform expects vs. live" for the changed attribute. Phase 1 builds it from CloudTrail
        request parameters and recorded state; Phase 2 from `terraform plan -refresh-only`.
      required: [tf_root, tf_address, attribute, lines]
      properties:
        tf_root:
          type: string
          examples: [terraform/demo-app/us-east-1]
        tf_address:
          type: string
        attribute:
          type: string
          description: Attribute or block the lines describe.
          examples: [ingress rules]
        lines:
          type: array
          items:
            $ref: "#/components/schemas/DriftLine"
    Change:
      type: object
      description: |
        A change with everything the detail page shows. The row fields repeat `ChangeSummary`
        (flat rather than `allOf`, to match the schema FastAPI generates).
      required:
        - id
        - title
        - event_name
        - service
        - event_time
        - detected_at
        - resource_arn
        - resource_name
        - tf_address
        - principal_arn
        - session_name
        - via
        - risk
        - status
        - cloudtrail_event_id
        - region
        - source_ip
        - user_agent
        - request_parameters
        - decision
        - decided_by
        - decided_at
        - reason
        - analysis
        - drift
        - remediation
        - linked_incidents
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        event_name:
          type: string
        service:
          type: string
        event_time:
          type: string
          format: date-time
        detected_at:
          type: string
          format: date-time
        resource_arn:
          type: string
        resource_name:
          type:
            - string
            - "null"
        tf_address:
          type:
            - string
            - "null"
        principal_arn:
          type: string
        session_name:
          type:
            - string
            - "null"
        via:
          $ref: "#/components/schemas/Via"
        risk:
          anyOf:
            - $ref: "#/components/schemas/Risk"
            - type: "null"
        status:
          $ref: "#/components/schemas/ChangeStatus"
        cloudtrail_event_id:
          type: string
          description: CloudTrail `eventID`; intake deduplicates on it.
        region:
          type: string
          examples: [us-east-1]
        source_ip:
          type:
            - string
            - "null"
          description: Caller's source IP address, or an AWS service name.
        user_agent:
          type:
            - string
            - "null"
          description: Untrusted text from CloudTrail.
        request_parameters:
          type:
            - object
            - "null"
          additionalProperties: true
          description: CloudTrail `requestParameters`, redacted. Untrusted data.
        decision:
          anyOf:
            - $ref: "#/components/schemas/ChangeDecision"
            - type: "null"
        decided_by:
          type:
            - string
            - "null"
          description: Username of the admin who decided.
        decided_at:
          type:
            - string
            - "null"
          format: date-time
        reason:
          type:
            - string
            - "null"
          description: The note given with the decision (required for accept).
        analysis:
          anyOf:
            - $ref: "#/components/schemas/Analysis"
            - type: "null"
          description: The latest analysis; null until the first agent run finishes.
        drift:
          anyOf:
            - $ref: "#/components/schemas/Drift"
            - type: "null"
        remediation:
          anyOf:
            - $ref: "#/components/schemas/Remediation"
            - type: "null"
          description: The current revert or codify remediation, if any.
        linked_incidents:
          type: array
          items:
            $ref: "#/components/schemas/LinkedIncident"
    ChangeCounts:
      type: object
      description: |
        Numbers for the change log's summary tiles and status chips. Every list filter applies
        except `status`, which is ignored here so that viewing `accepted` still shows
        "awaiting review: 3" on its chip. "Closed" = `reverted` + `accepted` + `codified`.
      required:
        [by_status, total, awaiting_review, high_risk_open, linked_to_incident, closed_last_7_days]
      properties:
        by_status:
          type: object
          description: Count per `ChangeStatus` (ignoring the `status` filter); every status is present, zero if none.
          propertyNames:
            $ref: "#/components/schemas/ChangeStatus"
          additionalProperties:
            type: integer
            minimum: 0
        total:
          type: integer
          minimum: 0
        awaiting_review:
          type: integer
          minimum: 0
        high_risk_open:
          type: integer
          minimum: 0
          description: Risk `high` and not yet closed.
        linked_to_incident:
          type: integer
          minimum: 0
        closed_last_7_days:
          type: integer
          minimum: 0
    ChangePage:
      type: object
      required: [items, total, page, page_size, counts]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChangeSummary"
        total:
          type: integer
          minimum: 0
          description: Number of changes matching the filters, across all pages.
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        counts:
          $ref: "#/components/schemas/ChangeCounts"
    RevertRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type:
            - string
            - "null"
          maxLength: 2000
          description: Optional reason, stored with the decision.
    RevertResponse:
      type: object
      required: [change, run_url]
      properties:
        change:
          $ref: "#/components/schemas/Change"
        run_url:
          type:
            - string
            - "null"
          format: uri
          description: The GitHub Actions run, if GitHub returned it on dispatch.
    AcceptRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note:
          type: string
          minLength: 1
          maxLength: 2000
          description: Why the change is intended. Required.
    CodifyRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type:
            - string
            - "null"
          maxLength: 2000

    # --- Incidents ------------------------------------------------------------------------------
    IncidentSummary:
      type: object
      description: One row of the incident list. The UI shows `id` as `INC-12`.
      required:
        - id
        - alertname
        - severity
        - namespace
        - workload
        - status
        - opened_at
        - resolved_at
        - linked_changes
      properties:
        id:
          type: integer
          format: int64
        alertname:
          type: string
          examples: [KubePodCrashLooping]
        severity:
          type:
            - string
            - "null"
          description: The alert's `severity` label.
        namespace:
          type:
            - string
            - "null"
        workload:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/IncidentStatus"
        opened_at:
          type: string
          format: date-time
        resolved_at:
          type:
            - string
            - "null"
          format: date-time
        linked_changes:
          type: array
          items:
            $ref: "#/components/schemas/ChangeRef"
    LinkedChange:
      type: object
      required: [change, confidence]
      properties:
        change:
          $ref: "#/components/schemas/ChangeRef"
        confidence:
          $ref: "#/components/schemas/Confidence"
    Incident:
      type: object
      description: An incident with everything the detail page shows (flat, like `Change`).
      required:
        - id
        - alertname
        - severity
        - namespace
        - workload
        - status
        - opened_at
        - resolved_at
        - fingerprint
        - labels
        - annotations
        - time_to_resolve_seconds
        - analysis
        - remediation
        - linked_changes
      properties:
        id:
          type: integer
          format: int64
        alertname:
          type: string
        severity:
          type:
            - string
            - "null"
        namespace:
          type:
            - string
            - "null"
        workload:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/IncidentStatus"
        opened_at:
          type: string
          format: date-time
        resolved_at:
          type:
            - string
            - "null"
          format: date-time
        fingerprint:
          type: string
          description: Alertmanager fingerprint of the alert that opened it.
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        time_to_resolve_seconds:
          type:
            - integer
            - "null"
          minimum: 0
        analysis:
          anyOf:
            - $ref: "#/components/schemas/Analysis"
            - type: "null"
        remediation:
          anyOf:
            - $ref: "#/components/schemas/Remediation"
            - type: "null"
          description: The proposed or applied remediation, if any.
        linked_changes:
          type: array
          items:
            $ref: "#/components/schemas/LinkedChange"
    IncidentPage:
      type: object
      required: [items, total, page, page_size]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/IncidentSummary"
        total:
          type: integer
          minimum: 0
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
    TriageRequest:
      type: object
      additionalProperties: false
      properties:
        model:
          type:
            - string
            - "null"
          maxLength: 128
          description: Model override; null uses `TRIAGE_MODEL`.
    ApproveRemediationRequest:
      type: object
      additionalProperties: false
      properties:
        note:
          type:
            - string
            - "null"
          maxLength: 2000
    RejectRemediationRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 2000
    PostmortemRequest:
      type: object
      additionalProperties: false
      required: [postmortem_md]
      properties:
        postmortem_md:
          type: string
          maxLength: 100000

    # --- Analysis, evidence, remediation --------------------------------------------------------
    AgentRun:
      type: object
      description: One triage run, for the "Confidence · 4 tool calls · model · 11 s" line.
      required:
        - id
        - model
        - prompt_version
        - escalated
        - started_at
        - finished_at
        - tool_calls
        - input_tokens
        - output_tokens
        - outcome
      properties:
        id:
          type: integer
          format: int64
        model:
          type: string
        prompt_version:
          description: The prompt set the run used (`v2`); null for runs recorded before it was stored.
          type:
            - string
            - "null"
        escalated:
          description: >-
            Whether this was the worker's one automatic re-run with `TRIAGE_MODEL_ESCALATION`
            after a low-confidence result or no proposal on an incident with container restarts.
          type: boolean
        started_at:
          type: string
          format: date-time
        finished_at:
          type:
            - string
            - "null"
          format: date-time
        tool_calls:
          type: integer
          minimum: 0
        input_tokens:
          type:
            - integer
            - "null"
          minimum: 0
        output_tokens:
          type:
            - integer
            - "null"
          minimum: 0
        outcome:
          $ref: "#/components/schemas/AgentRunOutcome"
    Analysis:
      type: object
      description: The agent's structured result (`submit_analysis`), plus the editable postmortem.
      required:
        - id
        - subject_type
        - subject_id
        - summary
        - risk
        - risk_reason
        - root_cause
        - confidence
        - flags
        - postmortem_md
        - agent_run
      properties:
        id:
          type: integer
          format: int64
        subject_type:
          $ref: "#/components/schemas/SubjectType"
        subject_id:
          type: integer
          format: int64
        summary:
          type: string
          description: Plain-language who, what, when, and how; Markdown-free.
        risk:
          anyOf:
            - $ref: "#/components/schemas/Risk"
            - type: "null"
        risk_reason:
          type:
            - string
            - "null"
          description: The "Risk." paragraph on the change detail page.
        root_cause:
          type:
            - string
            - "null"
          description: For incidents; null for a change with no symptom.
        confidence:
          $ref: "#/components/schemas/Confidence"
        flags:
          type: array
          items:
            $ref: "#/components/schemas/AnalysisFlag"
        postmortem_md:
          type:
            - string
            - "null"
          description: Markdown, editable by an admin. Render with HTML disabled.
        agent_run:
          $ref: "#/components/schemas/AgentRun"
    Evidence:
      type: object
      required: [id, agent_run_id, seq, tool_name, args, result_excerpt, created_at]
      properties:
        id:
          type: integer
          format: int64
        agent_run_id:
          type: integer
          format: int64
        seq:
          type: integer
          minimum: 1
          description: Order of the call within its run.
        tool_name:
          type: string
          examples: [get_security_group]
        args:
          type: object
          additionalProperties: true
        result_excerpt:
          type: string
          description: Truncated and redacted tool result. Untrusted text.
        created_at:
          type: string
          format: date-time
    EvidenceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Evidence"
    Remediation:
      type: object
      required:
        - id
        - subject_type
        - subject_id
        - kind
        - status
        - payload
        - decided_by
        - external_url
        - created_at
        - applied_at
        - error
      properties:
        id:
          type: integer
          format: int64
        subject_type:
          $ref: "#/components/schemas/SubjectType"
        subject_id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/RemediationKind"
        status:
          $ref: "#/components/schemas/RemediationStatus"
        payload:
          type: object
          additionalProperties: true
          description: |
            Kind-specific. `cluster_patch`: target deployment and the allowlisted patch;
            `set_memory_limit`: namespace, deployment, container, the new `memory_limit`, and the
            agent's `reason`; `rollback`: deployment and target revision; `revert_workflow`: change ID and root;
            `codify_pr`: branch and files.
        decided_by:
          type:
            - string
            - "null"
          description: Username, or `policy:<name>` when the policy gate auto-approved.
        external_url:
          type:
            - string
            - "null"
          format: uri
          description: The GitHub workflow run or pull request.
        created_at:
          type: string
          format: date-time
        applied_at:
          type:
            - string
            - "null"
          format: date-time
        error:
          type:
            - string
            - "null"
        mode:
          anyOf:
            - $ref: "#/components/schemas/RemediationMode"
            - type: "null"
          description: Null until the policy gate has decided.
        policy:
          type:
            - string
            - "null"
          description: The remediation policy that decided, e.g. `oom-memory-bump` or `default`.
        gate_reason:
          type:
            - string
            - "null"
          description: |
            Why the gate chose this mode, e.g. the kill switch, the rate limit, or the validator
            rule that downgraded an auto fix to manual.
        decided_at:
          type:
            - string
            - "null"
          format: date-time
          description: When it was approved or rejected.
        before:
          type:
            - object
            - "null"
          additionalProperties: true
          description: |
            The values the patch changes, before it: `set_memory_limit` →
            `{"limits": {"memory": "128Mi"}, "requests": {"memory": "128Mi"}}`.
        after:
          type:
            - object
            - "null"
          additionalProperties: true
          description: |
            The same values after the patch, e.g. `{"limits": {"memory": "256Mi"}}`.
        steps:
          type: array
          default: []
          items:
            $ref: "#/components/schemas/RemediationStep"
          description: |
            Every step in order, for the incident timeline: `approved` or `rejected`, then the
            apply loop's `claimed`, `read`, `validate`, `dry_run`, `patch`, `rollout`, `verify`,
            `rollback`, and the outcome (`succeeded`, `failed`, `downgraded`).
    RemediationStep:
      type: object
      required: [step, at, ok, detail]
      properties:
        step:
          type: string
        at:
          type: string
          format: date-time
        ok:
          type: boolean
        detail:
          type: string

    # --- Webhooks -------------------------------------------------------------------------------
    AlertmanagerAlert:
      type: object
      required: [status, labels, annotations, startsAt, fingerprint]
      properties:
        status:
          type: string
          enum: [firing, resolved]
        labels:
          type: object
          additionalProperties:
            type: string
        annotations:
          type: object
          additionalProperties:
            type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        generatorURL:
          type: string
        fingerprint:
          type: string
    AlertmanagerWebhook:
      type: object
      description: Alertmanager webhook payload, version 4. Unknown fields are ignored.
      required: [version, status, alerts]
      properties:
        version:
          type: string
          const: "4"
        groupKey:
          type: string
        truncatedAlerts:
          type: integer
          minimum: 0
        status:
          type: string
          enum: [firing, resolved]
        receiver:
          type: string
        groupLabels:
          type: object
          additionalProperties:
            type: string
        commonLabels:
          type: object
          additionalProperties:
            type: string
        commonAnnotations:
          type: object
          additionalProperties:
            type: string
        externalURL:
          type: string
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/AlertmanagerAlert"
    AlertWebhookResult:
      type: object
      required: [opened, resolved, ignored]
      properties:
        opened:
          type: array
          description: IDs of incidents opened by this delivery.
          items:
            type: integer
            format: int64
        resolved:
          type: array
          description: IDs of incidents resolved by this delivery.
          items:
            type: integer
            format: int64
        ignored:
          type: integer
          minimum: 0
          description: Alerts that matched no rule or were duplicates.
    GithubWorkflowRun:
      type: object
      required: [id, html_url, status, path]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        display_title:
          type: string
          description: Set by `revert.yaml`'s `run-name` to `revert change <id>`.
        path:
          type: string
          examples: [.github/workflows/revert.yaml]
        html_url:
          type: string
          format: uri
        status:
          type: string
          examples: [completed]
        conclusion:
          type:
            - string
            - "null"
          examples: [success]
    GithubWorkflowRunEvent:
      type: object
      description: The fields of GitHub's `workflow_run` event the backend reads. Others are ignored.
      required: [action, workflow_run]
      properties:
        action:
          type: string
          enum: [requested, in_progress, completed]
        workflow_run:
          $ref: "#/components/schemas/GithubWorkflowRun"

    # --- Intake, stats, ops ---------------------------------------------------------------------
    IntakeHealth:
      type: object
      required:
        - state
        - reasons
        - region
        - checked_at
        - last_event_at
        - last_canary_at
        - queue_backlog
        - oldest_message_age_seconds
        - dead_letter_count
        - trail_logging
        - grafana_url
      properties:
        state:
          $ref: "#/components/schemas/IntakeState"
        reasons:
          type: array
          description: Why the state isn't `live`, one line each ("no canary for 52 min"). Empty when live.
          items:
            type: string
        region:
          type: string
          description: The watched region.
          examples: [us-east-1]
        checked_at:
          type: string
          format: date-time
        last_event_at:
          type:
            - string
            - "null"
          format: date-time
          description: Last change event received (excluding the canary).
        last_canary_at:
          type:
            - string
            - "null"
          format: date-time
        queue_backlog:
          type:
            - integer
            - "null"
          minimum: 0
          description: Approximate messages waiting in the change queue; null if SQS is unreachable.
        oldest_message_age_seconds:
          type:
            - integer
            - "null"
          minimum: 0
        dead_letter_count:
          type:
            - integer
            - "null"
          minimum: 0
        trail_logging:
          type:
            - boolean
            - "null"
          description: Whether the CloudTrail trail is logging; null if unknown or in replay.
        grafana_url:
          type:
            - string
            - "null"
          format: uri
          description: The "Intake health" Grafana dashboard, if reachable from the browser.
    PrincipalCount:
      type: object
      required: [principal_arn, count]
      properties:
        principal_arn:
          type: string
        count:
          type: integer
          minimum: 0
    Stats:
      type: object
      required:
        - since
        - until
        - changes_by_principal
        - median_time_to_document_seconds
        - reverted
        - codified
        - accepted
      properties:
        since:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
        changes_by_principal:
          type: array
          items:
            $ref: "#/components/schemas/PrincipalCount"
        median_time_to_document_seconds:
          type:
            - integer
            - "null"
          minimum: 0
          description: Median from `event_time` to the review decision.
        reverted:
          type: integer
          minimum: 0
        codified:
          type: integer
          minimum: 0
        accepted:
          type: integer
          minimum: 0
    ProbeStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, error]
        checks:
          type: object
          description: "Per-dependency result for readiness, e.g. `{\"database\": \"ok\"}`."
          additionalProperties:
            type: string

    # --- Errors ---------------------------------------------------------------------------------
    ErrorDetail:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          description: Path to the offending field, e.g. `["body", "note"]`.
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code.
          examples: [invalid_state_transition]
        message:
          type: string
          description: Human-readable explanation.
        details:
          type: array
          description: Per-field problems, for `422`.
          items:
            $ref: "#/components/schemas/ErrorDetail"
