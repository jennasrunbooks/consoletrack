# ConsoleTrack on a laptop, no AWS (README → Try it without AWS; product-spec.md → Local run).
# `make local` starts it; `make local-down` removes it with its volumes.
#
# - Every port is bound to 127.0.0.1 only.
# - Settings come from .env (Compose reads it for ${...}) or the shell, which wins. Only the
#   names listed under `environment:` reach a container, never the whole file.
# - The only credentials here are local-only ones (Postgres). SESSION_SECRET and the admin
#   password are generated on first start unless .env sets them (backend/app/compose_entrypoint.py).
# - Images are built for the local machine's architecture (amd64 or arm64).
#
# `make local` also creates the `consoletrack` kind cluster (scripts/local-kind.sh) and adds
# compose/kind.yaml and the `kind` profile: k8s-mcp and the triage worker start, and the backend
# joins kind's Docker network so Alertmanager can reach it. Plain `docker compose up` (and
# LOCAL_KIND=false make local) runs without kind. The change intake (INTAKE_MODE=replay, SQS
# through ElasticMQ) and aws-mcp (fixtures mode) join with #9.
#
# Observability (docs/observability.md): the backend, worker, and k8s-mcp send OTLP to
# otel-collector, which writes traces to Tempo and logs to Loki; Grafana shows both with the
# "Incident journey" dashboard. With kind, metrics go to kind's Prometheus (compose/kind.yaml).
name: consoletrack

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

services:
  postgres:
    image: postgres:16.15-alpine3.24@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      # Local-only credentials, the same as DATABASE_URL in .env.example. EKS uses CloudNativePG.
      POSTGRES_USER: consoletrack
      POSTGRES_PASSWORD: consoletrack
      POSTGRES_DB: consoletrack
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consoletrack -d consoletrack"]
      interval: 2s
      timeout: 3s
      retries: 30

  # SQS-compatible; queues in compose/elasticmq.conf match the real names with suffix `local`.
  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1@sha256:e4580ab9ad1bd5cd37b4ba04911bc5ccc8cd2d9ab4de56ece65acee71c24e05c
    ports:
      - "127.0.0.1:${ELASTICMQ_PORT:-9324}:9324"
    volumes:
      - ./compose/elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- 'http://127.0.0.1:9324/?Action=ListQueues' >/dev/null"]
      interval: 2s
      timeout: 3s
      retries: 30

  backend:
    build: ./backend
    image: consoletrack-backend:local
    <<: *hardening
    # Fills in local secrets, runs `alembic upgrade head`, then starts uvicorn.
    command: ["python", "-m", "app.compose_entrypoint"]
    environment:
      DATABASE_URL: postgresql+psycopg://consoletrack:consoletrack@postgres:5432/consoletrack
      AWS_REGION: ${AWS_REGION:-us-east-1}
      # No AWS here: the intake indicator shows Replay, and Revert and Codify "AWS required".
      INTAKE_MODE: replay
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      VIEWER_PASSWORD_HASH: ${VIEWER_PASSWORD_HASH:-}
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-}
      GRAFANA_URL: ${GRAFANA_URL:-}
      TRIAGE_MODEL: ${TRIAGE_MODEL:-claude-haiku-5-5}
      TRIAGE_MODEL_ESCALATION: ${TRIAGE_MODEL_ESCALATION:-claude-sonnet-5-5}
      # app/telemetry.py: OTLP to the collector. TELEMETRY_EXPORTER=none turns it off.
      TELEMETRY_EXPORTER: ${TELEMETRY_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    volumes:
      - local-secrets:/run/consoletrack
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 40
      start_period: 10s

  frontend:
    build: ./frontend
    image: consoletrack-frontend:local
    <<: *hardening
    # DASHBOARD_PORT, not 5173: `make test-e2e` (Playwright) and `npm run dev` use that port.
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8080}:8080"
    volumes:
      # Adds the /api route to the backend, which the Gateway provides on EKS.
      - ./compose/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Read-only cluster tools for the triage agent, against the local kind cluster `consoletrack`.
  # `make local` writes kind-internal.kubeconfig (gitignored): kind's internal API server address
  # and the k8s-mcp ServiceAccount's token, so the chart's read-only RBAC applies here too.
  # Not published on the host: only the worker calls it, over Compose's network.
  k8s-mcp:
    build: ./mcp-server/k8s
    image: consoletrack-k8s-mcp:local
    profiles: [kind]
    <<: *hardening
    environment:
      K8S_ALLOWED_NAMESPACES: ${K8S_ALLOWED_NAMESPACES:-demo}
      # kube-prometheus-stack's NodePort on kind's network (helm/values/kube-prometheus-stack-local.yaml).
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://consoletrack-control-plane:30090}
      KUBECONFIG: /run/kube/config
      TELEMETRY_EXPORTER: ${TELEMETRY_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - ./kind-internal.kubeconfig:/run/kube/config:ro
    networks: [default, kind]
    healthcheck:
      # /readyz lists pods in every allowlisted namespace: API server reachable, RBAC in place.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Triage worker (#10): claims queued incidents and runs the agent against k8s-mcp with the real
  # model, so it needs ANTHROPIC_API_KEY from the shell. AWS_MCP_URL is empty: no AWS tools here,
  # and the agent is told so. The backend runs the migrations, so the worker waits for it.
  worker:
    build: ./backend
    image: consoletrack-backend:local
    profiles: [kind]
    <<: *hardening
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://consoletrack:consoletrack@postgres:5432/consoletrack
      K8S_MCP_URL: http://k8s-mcp:8080/mcp
      AWS_MCP_URL: ""
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      TRIAGE_MODEL: ${TRIAGE_MODEL:-claude-haiku-5-5}
      TRIAGE_MODEL_ESCALATION: ${TRIAGE_MODEL_ESCALATION:-claude-sonnet-5-5}
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
      # app/telemetry.py: OTLP to the collector. TELEMETRY_EXPORTER=none turns it off.
      TELEMETRY_EXPORTER: ${TELEMETRY_EXPORTER:-otlp}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    depends_on:
      backend:
        condition: service_healthy
      k8s-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(time.time() - os.path.getmtime('/tmp/worker-heartbeat') > 120)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  # --- Observability (docs/observability.md) -------------------------------------------------
  # Memory limits are ceilings for a laptop, not measurements; the PR for #33 lists what each
  # used during an OOM scenario run. Tempo and Loki keep their data on tmpfs (until restart).

  # OTLP/HTTP from the apps; not published on the host. compose/kind.yaml adds kind.yaml (metrics
  # to kind's Prometheus) and kind's network.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.2@sha256:7f22d2a6748110ffb6a59bc0df448bccbf501cdb667d610ede4c61d3863d5849
    <<: *hardening
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./observability/otel-collector:/etc/otelcol:ro
    mem_limit: 192m

  tempo:
    image: grafana/tempo:3.1.1@sha256:64e2fbd56d9c2b3412a4b430a58ea59e91a670b1e75f920a0c702213ad145044
    <<: *hardening
    command: ["-target=all", "-config.file=/etc/tempo/tempo.yaml"]
    # Tempo 3's modules write under /var/tempo by default (live-store, WAL, blocks, the backend
    # scheduler), not all of them configurable in one place: the whole directory is tmpfs.
    tmpfs: [/tmp, /var/tempo]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    mem_limit: 384m

  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    <<: *hardening
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
    mem_limit: 384m

  # Tempo, Loki, and Prometheus (kind's), and the provisioned "Incident journey" dashboard.
  # Writes its database to the grafana-data volume, so the root filesystem stays writable.
  grafana:
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Sets the admin password: GRAFANA_ADMIN_PASSWORD, or a generated one `make local` prints.
    entrypoint: ["/bin/sh", "/etc/consoletrack/entrypoint.sh"]
    environment:
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      # kube-prometheus-stack's NodePort on kind's network, as for k8s-mcp.
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://consoletrack-control-plane:30090}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/incident-journey.json
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/entrypoint.sh:/etc/consoletrack/entrypoint.sh:ro
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 512m

networks:
  # kind's own Docker network, created by `kind create cluster`; only the kind profile uses it.
  kind:
    external: true

volumes:
  postgres-data:
  local-secrets:
  grafana-data:
