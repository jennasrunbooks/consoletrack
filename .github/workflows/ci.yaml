name: ci

on:
  pull_request:
    # `labeled` so that adding `full-ci` starts a full run. Any other label re-runs the PR's
    # normal selection.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:
  # Nightly: local-kind (with lint and test) on main, whatever the day's PRs skipped.
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: read

# The event is in the group so the nightly run and a push to main don't cancel each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # kind v0.33.0's default node image (kind-action v1.15.1 installs v0.33.0); bump with
  # kind-action. Pulled in the background at the start of the kind jobs, so `kind create cluster`
  # finds it already present. A mismatch only costs the pull again.
  KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      # Areas, for the step summary and anyone reading the run.
      backend: ${{ steps.areas.outputs.backend }}
      frontend: ${{ steps.areas.outputs.frontend }}
      demo_app: ${{ steps.areas.outputs.demo_app }}
      k8s_mcp: ${{ steps.areas.outputs.k8s_mcp }}
      helm: ${{ steps.areas.outputs.helm }}
      compose: ${{ steps.areas.outputs.compose }}
      terraform: ${{ steps.areas.outputs.terraform }}
      everything: ${{ steps.areas.outputs.everything }}
      docs_only: ${{ steps.areas.outputs.docs_only }}
      # One per gated job: true or false.
      test: ${{ steps.areas.outputs.test }}
      terraform_fmt: ${{ steps.areas.outputs.terraform_fmt }}
      e2e: ${{ steps.areas.outputs.e2e }}
      frontend_image: ${{ steps.areas.outputs.frontend_image }}
      demo_app_image: ${{ steps.areas.outputs.demo_app_image }}
      integration: ${{ steps.areas.outputs.integration }}
      local_stack: ${{ steps.areas.outputs.local_stack }}
      k8s_mcp_kind: ${{ steps.areas.outputs.k8s_mcp_kind }}
      local_kind: ${{ steps.areas.outputs.local_kind }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: areas
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          FULL_CI_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
        run: |
          set -euo pipefail
          full=false
          files=
          case "$EVENT" in
            push | workflow_dispatch) full=true ;;
            schedule) ;;
            pull_request)
              # HEAD is the PR merged into its base, so this is the PR's own change.
              files=$(git diff --name-only "$BASE_SHA" HEAD)
              if [ "$FULL_CI_LABEL" = true ]; then full=true; fi
              ;;
            *) echo "::error::unexpected event $EVENT"; exit 1 ;;
          esac
          printf 'changed files:\n%s\n' "${files:-(none: $EVENT)}"

          # Docs-only: *.md anywhere (product-spec.md, helm/README.md, ...) and docs/**, nothing else.
          # Then no area has changed, whatever directory the Markdown is in.
          docs_only=false
          if [ -n "$files" ] && ! grep -Evq '\.md$|^docs/' <<<"$files"; then
            docs_only=true
            files=
          fi

          flag() { if grep -Eq "$1" <<<"$files"; then echo true; else echo false; fi; }
          any() {
            for v in "$@"; do if [ "$v" = true ]; then echo true; return; fi; done
            echo false
          }
          backend=$(flag '^backend/')
          frontend=$(flag '^frontend/')
          demo_app=$(flag '^demo-app/')
          k8s_mcp=$(flag '^mcp-server/k8s/')
          helm=$(flag '^helm/')
          compose=$(flag '^(docker-compose\.yaml$|compose/)')
          terraform=$(flag '^(terraform/|\.tflint\.hcl$)')
          everything=$(flag '^(Makefile$|\.github/|agent-hooks/|openapi\.yaml$)|(^|/)(pyproject\.toml|uv\.lock|package-lock\.json)$')
          if [ "$everything" = true ]; then full=true; fi
          nightly=$([ "$EVENT" = schedule ] && echo true || echo false)
          test_job=$([ "$docs_only" = true ] && [ "$full" = false ] && echo false || echo true)

          out=$(
            echo "backend=$backend"
            echo "frontend=$frontend"
            echo "demo_app=$demo_app"
            echo "k8s_mcp=$k8s_mcp"
            echo "helm=$helm"
            echo "compose=$compose"
            echo "terraform=$terraform"
            echo "everything=$everything"
            echo "docs_only=$docs_only"
            echo "test=$test_job"
            echo "terraform_fmt=$(any "$full" "$terraform")"
            echo "e2e=$(any "$full" "$frontend")"
            echo "frontend_image=$(any "$full" "$frontend")"
            echo "demo_app_image=$(any "$full" "$demo_app")"
            echo "integration=$(any "$full" "$backend")"
            echo "local_stack=$(any "$full" "$backend" "$frontend" "$compose")"
            echo "k8s_mcp_kind=$(any "$full" "$k8s_mcp" "$helm" "$(flag '^scripts/test-k8s\.sh$')")"
            echo "local_kind=$(any "$full" "$nightly" "$helm" "$compose" "$demo_app" \
              "$(flag '^scripts/local-kind\.sh$')" "$(flag '^backend/app/services/remediation')")"
          )
          echo "$out" >> "$GITHUB_OUTPUT"
          # shellcheck disable=SC2016 # Markdown code fences, not command substitution
          printf '### changes (%s)\n\n```text\n%s\n```\n' "$EVENT" "$out" >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v4.3.1"
      - uses: helmfile/helmfile-action@614b4cd063ada10b87f668f6ffd35485bce0cac5 # v2.4.8
        with:
          helm-version: "v4.3.1"
          helmfile-version: "v1.8.2"
          helm-plugins: |
            https://github.com/databus23/helm-diff@v3.15.15
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Vite 8 and MSW 3 need Node >= 22.12; the devcontainer runs 24.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make lint

  test:
    name: test
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.test != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Vite 8 and MSW 3 need Node >= 22.12; the devcontainer runs 24.
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The browser tests run in the `e2e` job below.
      - run: make test SKIP_E2E=1

  terraform-fmt:
    name: terraform-fmt
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.terraform_fmt != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Keep identical to the terraform feature's version in .devcontainer/devcontainer.json,
          # so `terraform fmt` gives the same answer locally and in CI.
          terraform_version: 1.13.4
          terraform_wrapper: false
      # Same as `terraform fmt -check -recursive terraform/`.
      - run: make lint-terraform

  # Playwright against `npm run dev:mock` (MSW in the page, no backend). The tests abort and fail
  # on any request beyond localhost, so the runner's network is only used to install.
  e2e:
    name: e2e
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.e2e != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: frontend
      # The browser build belongs to playwright-core's version (pinned in package-lock.json).
      - id: playwright
        run: echo "version=$(jq -r '.packages["node_modules/playwright-core"].version' frontend/package-lock.json)" >> "$GITHUB_OUTPUT"
      - id: browser-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium
      - if: steps.browser-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      # The cache holds the browser only; its system libraries still come from apt.
      - if: steps.browser-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
        working-directory: frontend
      - run: make test-e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14

  # Not a required check: builds the dashboard image (amd64, no push) so Dockerfile and
  # nginx.conf changes are exercised. The arm64 build and push belong to the deploy pipeline.
  frontend-image:
    name: frontend-image
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.frontend_image != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Layer cache scopes are per image and shared with local-stack and local-kind.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          tags: consoletrack-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max,ignore-error=true
      - name: Serve /healthz and the app
        run: |
          docker run -d --name fe -p 8080:8080 consoletrack-frontend:ci
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/changes | grep -q '<div id="root">'
          test "$(docker inspect -f '{{.Config.User}}' consoletrack-frontend:ci)" = "101"

  # Not a required check: builds the demo app image (amd64, no push) and runs both modes the way
  # helm/charts/demo-app does. The arm64 build and push belong to the deploy pipeline.
  demo-app-image:
    name: demo-app-image
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.demo_app_image != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      IMAGE: consoletrack-demo-app:ci
      HARDENED: --read-only --cap-drop ALL --security-opt no-new-privileges:true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: demo-app
          tags: ${{ env.IMAGE }}
          load: true
          cache-from: type=gha,scope=demo-app
          cache-to: type=gha,scope=demo-app,mode=max,ignore-error=true
      - name: Image size, user, and base
        run: |
          test "$(docker inspect -f '{{.Config.User}}' "$IMAGE")" = "10001"
          docker image inspect -f 'size: {{.Size}} bytes' "$IMAGE"
          grep -m1 '^FROM python' demo-app/Dockerfile
      - name: Server and traffic generator, no AWS (DEMO_BUCKET empty)
        run: |
          docker network create demo
          # shellcheck disable=SC2086 # HARDENED is a list of flags
          docker run -d --name demo-app --network demo $HARDENED "$IMAGE"
          # shellcheck disable=SC2086
          docker run -d --name loadgen --network demo -p 8081:8080 $HARDENED \
            -e DEMO_MODE=loadgen -e LOADGEN_TARGET=http://demo-app:8080/ "$IMAGE"
          for i in $(seq 1 20); do curl -fsS http://localhost:8081/healthz && break; sleep 1; done
          sleep 3
          metrics=$(curl -fsS http://localhost:8081/metrics)
          echo "$metrics" | grep '^demo_client_requests_total'
          echo "$metrics" | grep -Eq '^demo_client_requests_total\{result="ok"\} [1-9]'
          echo "$metrics" | grep -Eq '^demo_client_requests_total\{result="http_error"\} 0'
      - name: OOM fault sizing (report cache, 140 MiB cap)
        run: |
          # 80 large reports at 2 MiB each fill the 140 MiB cache; stops when the app dies.
          reports() {
            for _ in $(seq 1 80); do
              curl -fsS -o /dev/null -H 'X-Demo-Report: large' "$1/" || return 0
            done
          }
          up() { for _ in $(seq 1 20); do curl -fsS "$1/healthz" && return 0; sleep 1; done; return 1; }
          # The unchanged 128Mi limit: a full cache doesn't fit, so it's OOMKilled.
          # shellcheck disable=SC2086
          docker run -d --name oom --memory 128m --memory-swap 128m -p 8083:8080 $HARDENED "$IMAGE"
          up http://localhost:8083
          reports http://localhost:8083
          for _ in $(seq 1 20); do
            test "$(docker inspect -f '{{.State.Running}}' oom)" = false && break; sleep 1
          done
          test "$(docker inspect -f '{{.State.OOMKilled}}' oom)" = "true"
          # The fix, 2x: a full cache fits.
          # shellcheck disable=SC2086
          docker run -d --name fixed --memory 256m --memory-swap 256m -p 8082:8080 $HARDENED "$IMAGE"
          up http://localhost:8082
          reports http://localhost:8082
          test "$(docker inspect -f '{{.State.Running}}' fixed)" = "true"
          curl -fsS http://localhost:8082/metrics | grep -E '^demo_app_report_cache_bytes 1\.4680064e\+08$'
          docker stats --no-stream fixed
      - name: Logs
        if: failure()
        run: for c in demo-app loadgen oom fixed; do docker logs "$c" || true; done

  # Required check (add it to the ruleset): Postgres through Testcontainers, no secrets.
  integration:
    name: integration
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.integration != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: make test-integration

  # Not a required check: the stack `make local` starts (amd64 here), end to end. SESSION_SECRET
  # and the admin password are generated inside the stack; nothing comes from secrets.
  local-stack:
    name: local-stack
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.local_stack != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Compose's own images (the tags in docker-compose.yaml), built from the same contexts with
      # the layer cache; `up` then uses them instead of building.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          tags: consoletrack-backend:local
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max,ignore-error=true
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          tags: consoletrack-frontend:local
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max,ignore-error=true
      - run: docker compose up --wait --wait-timeout 300
      - name: Log in through the dashboard and read intake health
        run: |
          # localhost, not 127.0.0.1: curl, like browsers, keeps the Secure session cookie
          # over plain HTTP only for localhost.
          base=http://localhost:8080
          curl -fsS "$base/healthz"
          curl -fsS http://127.0.0.1:8000/readyz
          pw=$(docker compose exec -T backend cat /run/consoletrack/admin-password)
          echo "::add-mask::$pw"
          jq -n --arg p "$pw" '{username: "admin", password: $p}' \
            | curl -fsS -c jar -H 'Content-Type: application/json' --data @- "$base/api/v1/auth/login"
          curl -fsS -b jar "$base/api/v1/intake/health" | jq -e '.state == "replay"'
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down --volumes

  # Not a required check (yet): k8s-mcp's tools against a real API server with the RBAC the
  # consoletrack chart ships (`kubectl auth can-i` denies Secrets, ConfigMaps, exec, and writes).
  # scripts/test-k8s.sh renders the RBAC with helm and creates and deletes the kind cluster
  # itself; kind-action only installs kind and kubectl.
  k8s-mcp-kind:
    name: k8s-mcp-kind
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.k8s_mcp_kind != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # While the tools install. Detached, so it outlives the step; "Wait for the kind node
      # image" collects it.
      - name: Pull the kind node image
        run: |
          # shellcheck disable=SC2016 # expanded by the inner sh
          nohup sh -c 'docker pull "$KIND_NODE_IMAGE" >"$RUNNER_TEMP/kind-pull.log" 2>&1
            echo $? >"$RUNNER_TEMP/kind-pull.rc"' >/dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v4.3.1"
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
      # A failed pull isn't fatal: kind pulls the image itself.
      - name: Wait for the kind node image
        run: |
          for _ in $(seq 1 180); do [ -f "$RUNNER_TEMP/kind-pull.rc" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/kind-pull.log" || true
      - run: make test-k8s

  # Not a required check (yet): `make local` end to end on a fresh runner, the kind half of #15.
  # scripts/local-kind.sh creates the kind cluster, applies kube-prometheus-stack and demo-app,
  # starts Compose with k8s-mcp, and checks that Alertmanager reaches the Compose backend. Then an
  # alert posted to Alertmanager has to arrive as an incident. No secrets: `make local` only
  # checks that ANTHROPIC_API_KEY is set, and nothing here calls the model.
  local-kind:
    name: local-kind
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.local_kind != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # While the tools install and the images build; see k8s-mcp-kind.
      - name: Pull the kind node image
        run: |
          # shellcheck disable=SC2016 # expanded by the inner sh
          nohup sh -c 'docker pull "$KIND_NODE_IMAGE" >"$RUNNER_TEMP/kind-pull.log" 2>&1
            echo $? >"$RUNNER_TEMP/kind-pull.rc"' >/dev/null 2>&1 &
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v4.3.1"
      - uses: helmfile/helmfile-action@614b4cd063ada10b87f668f6ffd35485bce0cac5 # v2.4.8
        with:
          helm-version: "v4.3.1"
          helmfile-version: "v1.8.2"
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          install_only: true
      # The images `make local` would build (the tags in docker-compose.yaml and the Makefile's
      # DEMO_APP_IMAGE), from the same contexts with the layer cache; SKIP_BUILD=1 below uses them.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          tags: consoletrack-backend:local
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max,ignore-error=true
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          tags: consoletrack-frontend:local
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max,ignore-error=true
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: mcp-server/k8s
          tags: consoletrack-k8s-mcp:local
          load: true
          cache-from: type=gha,scope=k8s-mcp
          cache-to: type=gha,scope=k8s-mcp,mode=max,ignore-error=true
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: demo-app
          tags: ghcr.io/jennasrunbooks/consoletrack-demo-app:local
          load: true
          cache-from: type=gha,scope=demo-app
          cache-to: type=gha,scope=demo-app,mode=max,ignore-error=true
      # A failed pull isn't fatal: kind pulls the image itself.
      - name: Wait for the kind node image
        run: |
          for _ in $(seq 1 180); do [ -f "$RUNNER_TEMP/kind-pull.rc" ] && break; sleep 1; done
          cat "$RUNNER_TEMP/kind-pull.log" || true
      - run: make local SKIP_BUILD=1
        env:
          ANTHROPIC_API_KEY: unused-in-ci
      - name: k8s-mcp's ServiceAccount stays read-only
        run: |
          sa=system:serviceaccount:consoletrack:k8s-mcp
          kc() { kubectl --context kind-consoletrack "$@"; }
          test "$(kc auth can-i list pods -n demo --as "$sa")" = yes
          test "$(kc auth can-i get secrets -n demo --as "$sa")" = no
          test "$(kc auth can-i patch deployments -n demo --as "$sa")" = no
      - name: An alert from kind becomes an incident
        run: |
          kc() { kubectl --context kind-consoletrack "$@"; }
          pod=$(kc -n monitoring get pods -l app.kubernetes.io/name=alertmanager -o name | head -n 1)
          kc -n monitoring exec "$pod" -c alertmanager -- wget -qO- \
            --header 'Content-Type: application/json' \
            --post-data '[{"labels":{"alertname":"LocalKindProbe","namespace":"demo","severity":"info"}}]' \
            http://127.0.0.1:9093/api/v2/alerts
          # localhost, not 127.0.0.1: curl keeps the Secure session cookie over HTTP only there.
          base=http://localhost:8080
          pw=$(docker compose exec -T backend cat /run/consoletrack/admin-password)
          echo "::add-mask::$pw"
          jq -n --arg p "$pw" '{username: "admin", password: $p}' \
            | curl -fsS -c jar -H 'Content-Type: application/json' --data @- "$base/api/v1/auth/login"
          # The route's groupWait is 30s.
          for _ in $(seq 1 24); do
            if curl -fsS -b jar "$base/api/v1/incidents?namespace=demo" \
              | jq -e '.items | any(.alertname == "LocalKindProbe")' >/dev/null; then
              echo "incident opened"; exit 0
            fi
            sleep 5
          done
          echo "no LocalKindProbe incident after 120s" >&2; exit 1
      - name: Logs
        if: failure()
        run: |
          docker compose -f docker-compose.yaml -f compose/kind.yaml --profile kind logs --no-color
          kubectl --context kind-consoletrack get pods -A
          kubectl --context kind-consoletrack -n monitoring logs -l app.kubernetes.io/name=alertmanager -c alertmanager --tail=100
      - if: always()
        run: make local-down
