# PROPOSED: a human needs to move this to .github/workflows/terraform.yaml.
# (The agent's token has no Workflows permission; see AGENTS.md → Hard rules, rule 4.)
#
# Terraform CI for every root under terraform/<account>/<scope>/ (product-spec.md → Testing,
# CI/CD, and deployment). Each account directory is one matrix entry with its own GitHub
# environments, <account>-plan and <account>-apply, and each environment holds that account's
# role ARN as the secret AWS_ROLE_ARN. Today there is one entry, `consoletrack`;
# terraform/demo-app/us-east-1 uses the hub's roles until demo-app moves to its own account.
#
#   pull_request touching terraform/**  → fmt -check, validate, tflint, plan per changed root,
#                                          plan posted as a PR comment (account ID replaced)
#   push to main touching terraform/**  → apply per changed root, after the <account>-apply
#                                          environment's required reviewer approves
#   workflow_dispatch with destroy      → destroy one root, behind the same approval
#
# Configuration uses the same names as .env, from repository variables (vars.*), so CI runs the
# same Makefile targets as a laptop. Set: AWS_REGION, NAME_SUFFIX, ENABLE_BUDGET,
# BUDGET_LIMIT_USD, DOMAIN, DNS_PARENT, K8S_VERSION, USE_SPOT, NODE_INSTANCE_TYPE, EXPOSURE,
# WATCHED_IAM_PATHS. OPERATOR_ARN is a repository secret: it contains the account ID.
# BUDGET_EMAIL is a repository secret, passed to Terraform as TF_VAR_budget_email in the plan and
# apply jobs only, never from a variable or a file in the repo.
#
# Every job sets role-session-name: gh-${{ github.run_id }}. The roles' trust policies require
# the gh- prefix, and the intake's EventBridge rule excludes pipeline calls by it.
name: terraform

on:
  pull_request:
    paths: ["terraform/**", ".tflint.hcl"]
  push:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch:
    inputs:
      # consoletrack/global isn't offered: its boundary and OIDC provider are out of the apply
      # role's reach on purpose, so a human removes it with `make down-all`.
      root:
        description: Root to destroy
        required: true
        type: choice
        options:
          - demo-app/us-east-1
          - consoletrack/us-east-1
      destroy:
        description: Destroy the root (type the root's path again to confirm)
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  pull-requests: write

# One Terraform run per ref at a time; never cancel an apply halfway.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  AWS_REGION: ${{ vars.AWS_REGION }}
  NAME_SUFFIX: ${{ vars.NAME_SUFFIX }}
  GITHUB_REPO: ${{ github.repository }}
  ENABLE_GITHUB_OIDC: "true"
  OPERATOR_ARN: ${{ secrets.OPERATOR_ARN }}
  ENABLE_BUDGET: ${{ vars.ENABLE_BUDGET }}
  BUDGET_LIMIT_USD: ${{ vars.BUDGET_LIMIT_USD }}
  DOMAIN: ${{ vars.DOMAIN }}
  DNS_PARENT: ${{ vars.DNS_PARENT }}
  K8S_VERSION: ${{ vars.K8S_VERSION }}
  USE_SPOT: ${{ vars.USE_SPOT }}
  NODE_INSTANCE_TYPE: ${{ vars.NODE_INSTANCE_TYPE }}
  EXPOSURE: ${{ vars.EXPOSURE }}
  WATCHED_IAM_PATHS: ${{ vars.WATCHED_IAM_PATHS }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      accounts: ${{ steps.roots.outputs.accounts }}
      roots: ${{ steps.roots.outputs.roots }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: roots
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          DISPATCH_ROOT: ${{ inputs.root }}
          DISPATCH_CONFIRM: ${{ inputs.destroy }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) files=$(git diff --name-only "$BASE_SHA" HEAD) ;;
            push) files=$(git diff --name-only "$BEFORE_SHA" HEAD) ;;
            workflow_dispatch)
              if [ "$DISPATCH_CONFIRM" != "$DISPATCH_ROOT" ]; then
                echo "::error::Type the root's path ($DISPATCH_ROOT) in 'destroy' to confirm."
                exit 1
              fi
              files="terraform/$DISPATCH_ROOT/main" ;;
          esac
          # terraform/<account>/<scope>/... → <account>/<scope>, kept only if it is a root.
          # A change to .tflint.hcl re-checks every root.
          if grep -qx '.tflint.hcl' <<<"$files"; then
            files=$(find terraform -mindepth 3 -maxdepth 3 -name '*.tf')
          fi
          roots=$(grep -E '^terraform/[^/]+/[^/]+/' <<<"$files" | cut -d/ -f2-3 | sort -u |
            while read -r r; do ls "terraform/$r"/*.tf >/dev/null 2>&1 && echo "$r"; done || true)
          # Apply order inside an account: global before regional roots.
          roots=$(awk '{ print ($0 ~ /\/global$/ ? 0 : 1) "\t" $0 }' <<<"$roots" | sort | cut -f2 | sed '/^$/d')
          accounts=$(cut -d/ -f1 <<<"$roots" | sed '/^$/d' | sort -u)
          echo "roots=$(jq -cR '[., inputs] | map(select(. != ""))' <<<"$roots")" >> "$GITHUB_OUTPUT"
          echo "accounts=$(jq -cR '[., inputs] | map(select(. != ""))' <<<"$accounts")" >> "$GITHUB_OUTPUT"
          echo "Changed roots:"; echo "$roots"

  plan:
    name: plan (${{ matrix.account }})
    needs: changes
    # Fork PRs get no OIDC token, so they can't plan; maintainers' branches can.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.changes.outputs.accounts != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        account: ${{ fromJSON(needs.changes.outputs.accounts) }}
    environment: ${{ matrix.account }}-plan
    env:
      # Repository secret; the variable is sensitive, so plans show (sensitive value).
      TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          # Keep identical to .devcontainer/devcontainer.json and ci.yaml.
          terraform_version: 1.13.4
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.64.0
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gh-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Mask the account ID
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - name: fmt, validate, tflint, plan
        env:
          ROOTS: ${{ needs.changes.outputs.roots }}
          ACCOUNT: ${{ matrix.account }}
        run: |
          set -euo pipefail
          : > plans.md
          for root in $(jq -r --arg a "$ACCOUNT" '.[] | select(startswith($a + "/"))' <<<"$ROOTS"); do
            echo "::group::$root"
            terraform fmt -check -recursive "terraform/$root"
            make tf-init ROOT="$root"
            terraform -chdir="terraform/$root" validate
            tflint --chdir="terraform/$root" --config="$PWD/.tflint.hcl"
            make tf-plan ROOT="$root"
            {
              echo "### \`terraform/$root\`"
              echo
              echo '<details><summary>Plan</summary>'
              echo
              echo '```'
              terraform -chdir="terraform/$root" show -no-color tfplan | tail -c 60000
              echo '```'
              echo '</details>'
              echo
            } >> plans.md
            echo "::endgroup::"
          done
      - name: Comment the plan
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ACCOUNT: ${{ matrix.account }}
        run: |
          set -euo pipefail
          # Masking doesn't apply to comments: replace the account ID before posting.
          account_id=$(aws sts get-caller-identity --query Account --output text)
          { echo "## Terraform plan: \`$ACCOUNT\`"; echo; sed "s/$account_id/<account-id>/g" plans.md; } > comment.md
          gh pr comment "$PR" --body-file comment.md

  apply:
    name: apply (${{ matrix.account }})
    needs: changes
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      needs.changes.outputs.accounts != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        account: ${{ fromJSON(needs.changes.outputs.accounts) }}
    # Requires a reviewer's approval before any step runs.
    environment: ${{ matrix.account }}-apply
    env:
      # Repository secret; the variable is sensitive, so plans show (sensitive value).
      TF_VAR_budget_email: ${{ secrets.BUDGET_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gh-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Mask the account ID
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - name: Apply or destroy
        env:
          ROOTS: ${{ needs.changes.outputs.roots }}
          ACCOUNT: ${{ matrix.account }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          for root in $(jq -r --arg a "$ACCOUNT" '.[] | select(startswith($a + "/"))' <<<"$ROOTS"); do
            echo "::group::$root"
            make tf-init ROOT="$root"
            # The environment approval is the confirmation; `make tf-apply` is for humans only.
            if [ "$EVENT" = workflow_dispatch ]; then
              terraform -chdir="terraform/$root" destroy -input=false -auto-approve
            else
              terraform -chdir="terraform/$root" apply -input=false -auto-approve
            fi
            echo "::endgroup::"
          done
