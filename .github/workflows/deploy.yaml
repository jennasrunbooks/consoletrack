# Deploy to the cluster, if there is one (product-spec.md → Testing, CI/CD, and deployment).
# A human moves this file to .github/workflows/deploy.yaml (the agent token can't push there).
#
#   workflow_run (ci succeeded on main)  → build and push the arm64 images, then deploy
#   workflow_dispatch                    → the same, for the commit you run it on
#
# 1. images: builds every image for linux/arm64 on a native arm runner and pushes it to GHCR as
#    ghcr.io/jennasrunbooks/consoletrack-<name>:<first 7 characters of the commit>, with
#    GITHUB_TOKEN (packages: write). No AWS access.
# 2. deploy: environment consoletrack-deploy, OIDC into ct-gh-deploy-<suffix>. If the EKS cluster
#    doesn't exist it logs a skip and stays green. Otherwise it writes the Helm values from the
#    variables and secrets below, runs `make deploy` (helmfile -l tier=app apply, nothing
#    else), and smoke-tests /readyz through a port-forward.
#
# The deploy role can describe the one cluster and nothing else in IAM. In Kubernetes it is the
# group consoletrack-deployers: a namespaced Role in consoletrack and demo (docs/permissions.md).
# It can't apply tier=addons, so those stay a human's `make addons`. Because the Role comes from
# the consoletrack chart, the first `make deploy` is a human's too.
#
# Configuration uses the same names as .env. Repository variables (vars.*), all non-secret:
#   AWS_REGION, NAME_SUFFIX, CLUSTER_NAME (ct-eks-use1-<suffix>), TRAIL_NAME, EXPOSURE, DOMAIN,
#   ALLOWED_CIDRS, WATCHED_IAM_PATHS, TRIAGE_MODEL, TRIAGE_MODEL_ESCALATION, GRAFANA_URL,
#   DEMO_BUCKET (empty until the demo-app Terraform root exists)
# Environment secrets of consoletrack-deploy (they hold the account ID, which GitHub then masks):
#   AWS_ROLE_ARN (scripts/gh-env-secrets.sh sets it), CHANGES_QUEUE_URL, CHANGES_DLQ_URL,
#   CANARY_SECURITY_GROUP_ID, CERTIFICATE_ARN (only with a DOMAIN)
# The deploy role can't read Terraform state, so the last four come from
# `terraform -chdir=terraform/consoletrack/us-east-1 output` (or `make tf-output`), set once by
# a human with `gh secret set --env consoletrack-deploy`. Rerun after `make down` and `make up`:
# the queue URLs and security group are new. Every image package must also be public (README →
# Deploy to AWS → Images), or the nodes can't pull.
#
# The role session name is gh-<run id>: the roles' trust policies require the gh- prefix, and the
# intake's EventBridge rule excludes pipeline calls by it.
name: deploy

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:

# Never cancel a deploy halfway; the next one waits.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Release records live in ConfigMaps: the deploy group has no Secret access.
  HELM_DRIVER: configmap
  KUBE_CONTEXT: consoletrack-eks

jobs:
  images:
    name: images
    # A failed or cancelled ci run, a PR's run, and a fork's run deploy nothing.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit ci tested, not whatever main is by now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - id: tag
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "tag=${SHA:0:7}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Build and push linux/arm64 images
        env:
          IMAGE_TAG: ${{ steps.tag.outputs.tag }}
          IMAGES_SKIP_LOGIN: "1"
          GHCR_OWNER: ${{ github.repository_owner }}
        run: scripts/images.sh

  deploy:
    name: deploy
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: consoletrack-deploy
    permissions:
      id-token: write
      contents: read
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      NAME_SUFFIX: ${{ vars.NAME_SUFFIX }}
      EXPOSURE: ${{ vars.EXPOSURE }}
      DOMAIN: ${{ vars.DOMAIN }}
      ALLOWED_CIDRS: ${{ vars.ALLOWED_CIDRS }}
      WATCHED_IAM_PATHS: ${{ vars.WATCHED_IAM_PATHS }}
      TRIAGE_MODEL: ${{ vars.TRIAGE_MODEL }}
      TRIAGE_MODEL_ESCALATION: ${{ vars.TRIAGE_MODEL_ESCALATION }}
      GRAFANA_URL: ${{ vars.GRAFANA_URL }}
      CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
      TRAIL_NAME: ${{ vars.TRAIL_NAME }}
      DEMO_BUCKET: ${{ vars.DEMO_BUCKET }}
      CHANGES_QUEUE_URL: ${{ secrets.CHANGES_QUEUE_URL }}
      CHANGES_DLQ_URL: ${{ secrets.CHANGES_DLQ_URL }}
      CANARY_SECURITY_GROUP_ID: ${{ secrets.CANARY_SECURITY_GROUP_ID }}
      CERTIFICATE_ARN: ${{ secrets.CERTIFICATE_ARN }}
      HELM_VALUES_SOURCE: env
      IMAGE_TAG: ${{ needs.images.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: gh-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Mask the account ID
        run: echo "::add-mask::$(aws sts get-caller-identity --query Account --output text)"
      - name: Is there a cluster?
        id: cluster
        run: |
          set -uo pipefail
          if err=$(aws eks describe-cluster --name "$CLUSTER_NAME" --query cluster.status --output text 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q ResourceNotFoundException <<<"$err"; then
            echo "::notice::No EKS cluster $CLUSTER_NAME: skipping the deploy (make up creates it)."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            # AccessDenied and the like are a broken setup, not an absent cluster.
            echo "::error::Could not describe $CLUSTER_NAME: $(sed -E 's/[0-9]{12}/***/g' <<<"$err")"
            exit 1
          fi
      - if: steps.cluster.outputs.exists == 'true'
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: "v4.3.1"
      - if: steps.cluster.outputs.exists == 'true'
        uses: helmfile/helmfile-action@614b4cd063ada10b87f668f6ffd35485bce0cac5 # v2.4.8
        with:
          helm-version: "v4.3.1"
          helmfile-version: "v1.8.2"
          helm-plugins: |
            https://github.com/databus23/helm-diff@v3.15.15
      - name: Deploy the app releases (tier=app only)
        if: steps.cluster.outputs.exists == 'true'
        run: |
          aws eks update-kubeconfig --name "$CLUSTER_NAME" --alias "$KUBE_CONTEXT" > /dev/null
          # Writes helm/environments/values.generated.yaml from the variables and secrets above,
          # then applies the tier=app releases at IMAGE_TAG (the Makefile's deploy target).
          make deploy
      - name: Smoke test /readyz
        if: steps.cluster.outputs.exists == 'true'
        timeout-minutes: 3
        run: |
          set -uo pipefail
          kubectl --context "$KUBE_CONTEXT" -n consoletrack port-forward svc/backend 8000:8000 > port-forward.log 2>&1 &
          trap 'kill %1 2>/dev/null' EXIT
          ok=false
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 http://127.0.0.1:8000/readyz; then ok=true; break; fi
            sleep 5
          done
          if [ "$ok" != true ]; then
            echo "::error::/readyz did not answer 200 within 3 minutes"
            cat port-forward.log
            kubectl --context "$KUBE_CONTEXT" -n consoletrack get pods
            kubectl --context "$KUBE_CONTEXT" -n consoletrack logs deploy/backend --tail=100 || true
            exit 1
          fi
