# Dependabot version updates for ConsoleTrack.
# Weekly, grouped to keep PR noise down, with a cooldown so brand-new releases
# (the usual window for compromised packages) wait a few days before a PR opens.
version: 2

updates:
  # GitHub Actions used in .github/workflows/ (keeps SHA pins current)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci(deps)"

  # Terraform providers and terraform-aws-modules in every root
  - package-ecosystem: terraform
    directories:
      - /terraform/*/global
      - /terraform/*/us-east-1
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      terraform-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, terraform]
    commit-message:
      prefix: "chore(terraform)"

  # Python: backend, agent, and MCP servers (uv.lock)
  - package-ecosystem: uv
    directories:
      - /backend
      - /mcp-server/*
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, python]
    commit-message:
      prefix: "chore(deps)"

  # Frontend
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    labels: [dependencies, frontend]
    commit-message:
      prefix: "chore(deps)"

  # Base images in Dockerfiles
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
      - /mcp-server/*
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      base-images:
        patterns: ["*"]
    labels: [dependencies, docker]
    commit-message:
      prefix: "chore(docker)"

  # Helm: dependencies declared in our own charts' Chart.yaml only. Dependabot's Helm support
  # doesn't read Helmfile, so the third-party chart versions pinned in helm/helmfile.yaml.gotmpl
  # (kube-prometheus-stack, cloudnative-pg, the Load Balancer Controller, ExternalDNS) are bumped
  # by hand in a PR.
  - package-ecosystem: helm
    directories:
      - /helm/charts/*
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      helm-charts:
        patterns: ["*"]
    labels: [dependencies, helm]
    commit-message:
      prefix: "chore(helm)"
